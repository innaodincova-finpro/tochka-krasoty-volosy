      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">' +
        '<div style="position:relative">' +
          '<input class="inp" id="sv_h" inputmode="numeric" value="' + hh + '" ' +
          'style="padding-right:52px">' +
          '<span class="unit">часов</span></div>' +
        '<div style="position:relative">' +
          '<input class="inp" id="sv_m" inputmode="numeric" value="' + mm + '" ' +
          'style="padding-right:52px">' +
          '<span class="unit">минут</span></div>' +
      '</div>' +
      '<div class="hintline" id="sv_total">' + esc(dur(cur.dur)) + '</div></div>' +
    '<div class="field"><label class="lab">Цена, ₽</label>' +
      '<input class="inp" id="sv_price" inputmode="numeric" value="' + cur.price + '"></div>' +
    '<div class="field"><label class="lab">Что отсчитывать после этой работы</label>' +
      '<select class="inp" id="sv_kind">' + opts + '</select>' +
      '<div class="hintline">Это не список услуг: название вы пишете любое. Здесь кабинет ' +
      'спрашивает, от чего вести срок до следующего визита.</div></div>' +

/* Отчёт колориста. Считает по формулам и по двум срокам: через сколько
   отросли корни и через сколько вымылся тон. По первому видно, когда звать
   на коррекцию, по второму — какие формулы держатся. */
function pageQuality(){
  function avg(field){
    var l = DB.appts.filter(function(a){ return a[field] != null && a[field] !== ''; });
    if(!l.length) return null;
    return Math.round(l.reduce(function(s, a){ return s + (+a[field]); }, 0) / l.length);
  }
  var avgRoots = avg('rootsDays'), avgTone = avg('toneDays');
  var withForm = DB.appts.filter(function(a){
    return a.card && (a.card.brand || a.card.rootTone || a.card.lenTone);
  });
  var complaints = DB.appts.filter(function(a){ return a.complaint; });
  var redo = DB.appts.filter(function(a){ return a.redo; }).length;

  var tones = {}, brands = {};
  DB.appts.forEach(function(a){
    var k = a.card || {};
    [k.rootTone, k.lenTone].forEach(function(v){
      v = (v || '').trim(); if(v) tones[v] = (tones[v] || 0) + 1;
    });
    var b = (k.brand || '').trim(); if(b) brands[b] = (brands[b] || 0) + 1;
  });
  function top(obj, n){
    return Object.keys(obj).sort(function(a, b){ return obj[b] - obj[a] || (a < b ? -1 : 1); }).slice(0, n);
  }

  /* Краски без движения: тон из названия материала не встречался в формулах
     за последние три месяца. Списывать за мастера кабинет не берётся —
     он только показывает, что лежит зря. */
  var since = shiftDays(today(), -90), usedTones = {};
  DB.appts.forEach(function(a){
    if(a.date < since) return;
    var k = a.card || {};
    [k.rootTone, k.lenTone].forEach(function(v){ v = (v || '').trim(); if(v) usedTones[v] = 1; });
  });
  var idle = DB.stock.filter(function(m){
    if(!/краск/i.test(m.name)) return false;
    if(!(m.qty > 0)) return false;      /* нулевой остаток не «лежит зря» — его нет */
    var t = m.name.match(/(\d{1,2}[.,]\d{1,3})/);
    if(!t) return false;
    return !usedTones[t[1].replace(',', '.')];
  });

  /* два срока стоят на всю ширину: подписи у них длинные и в два столбца
     ломаются пополам */
  var h = '<div class="card"><div class="stats" style="grid-template-columns:1fr">' +
    '<div class="stat"><span>Корни отрастают за</span><b>' + (avgRoots ? days(avgRoots) : '—') + '</b></div>' +
    '<div class="stat"><span>Тон держится</span><b>' + (avgTone ? days(avgTone) : '—') + '</b></div>' +
    '</div><div class="stats" style="margin-top:8px">' +
    '<div class="stat"><span>С жалобой</span><b>' + complaints.length + '</b></div>' +
    '<div class="stat"><span>Переделок</span><b>' + redo + '</b></div>' +
    '<div class="stat"><span>С формулой</span><b>' + withForm.length + '</b></div>' +
    '</div></div>';

  var tt = top(tones, 5);
  h += '<div class="card" style="margin-top:12px"><div class="sec-t">Ходовые тоны</div>';
  if(!tt.length) h += '<div class="empty">Пока не из чего считать</div>';
  tt.forEach(function(v){
    h += '<div class="stat" style="margin-bottom:7px"><span>' + esc(v) + '</span><b>' + tones[v] + '</b></div>';
  });
  h += '</div>';

  var tb = top(brands, 5);
  h += '<div class="card" style="margin-top:12px"><div class="sec-t">Ходовые бренды</div>';
  if(!tb.length) h += '<div class="empty">Пока не из чего считать</div>';
  tb.forEach(function(v){
    h += '<div class="stat" style="margin-bottom:7px"><span>' + esc(v) + '</span><b>' + brands[v] + '</b></div>';
  });
  h += '</div>';

  if(complaints.length){
    var byC = {};
    complaints.forEach(function(a){ byC[a.complaint] = (byC[a.complaint] || 0) + 1; });
    h += '<div class="card" style="margin-top:12px"><div class="sec-t">На что жаловались</div>';
    top(byC, 6).forEach(function(v){
      h += '<div class="stat" style="margin-bottom:7px"><span>' + esc(v) + '</span><b>' + byC[v] + '</b></div>';
    });
    h += '</div>';
  }

  h += '<div class="card" style="margin-top:12px"><div class="sec-t">Краски без движения</div>';
  if(!idle.length) h += '<div class="empty">Всё, что лежит, за три месяца пригодилось</div>';
  idle.forEach(function(m){
    h += '<div class="stat" style="margin-bottom:7px"><span>' + esc(m.name) + '</span><b>' +
         m.qty + ' ' + esc(unitOf(m.qty, m.unit)) + '</b></div>';
  });
  h += '</div>';

  h += '<div class="hintline" style="margin-top:10px">Сроки считаются по тем работам, где на следующем ' +
       'визите записали, через сколько дней отросли корни и через сколько вымылся тон. ' +
       'Оба числа вписываются в «Что делали».</div>';
  openSheet('Качество работы', h, '<button class="btn" data-act="closeSheet">Закрыть</button>');
}

/* Формула показывается одним куском: клиент говорит «как в прошлый раз»,
   и мастер должен прочитать всё нужное, не листая. */
function formulaHtml(a){
  var k = a.card || {};
  var rows = [
    ['Бренд', k.brand], ['Тон корней', k.rootTone], ['Тон длины', k.lenTone],
    ['Оксид', k.oxide], ['Пропорция', k.ratio],
    ['Выдержка', k.hold ? k.hold + ' мин' : ''], ['Расход краски', k.grams],
    ['Зоны', k.zones], ['Техника', k.tech], ['Осветление', k.bleach],
    ['Тонирование после', k.toneAfter], ['Что было до', k.before], ['Результат', k.result]
  ].filter(function(r){ return r[1]; });
  var extra = [];
  if(a.rootsDays != null) extra.push('Корни отросли через ' + days(a.rootsDays));
  if(a.toneDays != null) extra.push('Тон вымылся через ' + days(a.toneDays));
  if(a.complaint) extra.push('Жалоба: ' + a.complaint);
  if(a.redo) extra.push('Переделывали');
  if(!rows.length && !extra.length) return '';
  return '<div style="font-size:13px;line-height:1.7">' +
    rows.map(function(r){ return esc(r[0]) + ': ' + esc(r[1]); }).join('<br>') +
    (extra.length ? (rows.length ? '<br>' : '') + extra.map(esc).join('<br>') : '') +
    '</div>';
}

    '</div>' + (a.note ? '<div class="muted" style="margin-top:8px">' + esc(a.note) + '</div>' : '') + '</div>';

  if(isColor(a) && needAllergy(c)){
    h += '<div class="card" style="margin-top:12px;background:var(--tint);border-color:var(--tintline)">' +
      '<div style="font-size:13px;line-height:1.55">Первое окрашивание этого клиента, аллергопроба не отмечена.</div>' +
      '<div class="btns"><button class="btn" data-act="allergy" data-id="' + c.id + '">Отметить аллергопробу</button></div></div>';
  }

  var fh = formulaHtml(a);
  if(fh) h += '<div class="card" style="margin-top:12px"><div class="sec-t">Что делали</div>' + fh + '</div>';

  var foot = '';
  if(a.status === 'plan') foot += '<button class="btn primary" data-act="start" data-id="' + a.id + '">Начать приём</button>';
  if(a.status === 'running'){
    foot += '<button class="btn primary" data-act="finish" data-id="' + a.id + '">Завершить приём</button>';
    /* начали не ту запись — можно отыграть назад прямо отсюда, а не искать
       эту кнопку на экране «Сегодня», где записи чужого дня не видно */
    foot += '<button class="btn" data-act="cancelStart" data-id="' + a.id + '">Отменить начало</button>';
  }
  if(a.status === 'done') foot += '<button class="btn green" data-act="pay" data-id="' + a.id + '">Отметить оплату</button>';
  if(a.status === 'plan' && a.date > today()){
    foot += '<button class="btn" data-act="sendConfirm" data-id="' + a.id + '">' +
            (a.sentConfirm ? 'Отправить подтверждение ещё раз' : 'Отправить подтверждение') + '</button>';
    if(a.date === shiftDays(today(), 1)){
      foot += '<button class="btn" data-act="sendRemind" data-id="' + a.id + '">Напомнить о завтрашнем приёме</button>';
    }
  }
  /* Изменить можно любую незавершённую запись, в том числе вчерашнюю:
     промахнулась в календаре — поправит, а не будет удалять и заводить заново,
     теряя формулу. */
  if(a.status === 'plan'){
    foot += '<button class="btn" data-act="moveAppt" data-id="' + a.id + '">Изменить запись</button>';
  }
  foot += '<button class="btn" data-act="editCard" data-id="' + a.id + '">Что делали</button>';
  foot += '<button class="btn ghost" data-act="askDelAppt" data-id="' + a.id + '">Удалить запись</button>';
  openSheet(c.name, h, foot);
}

/* ================= знаки препинания в надиктованном =================

   Ни один телефон не расставляет знаки в русской речи сам. У Apple
   автоматическая пунктуация в диктовке есть для тридцати с лишним языков,
   русского среди них нет; распознавание в браузере отдаёт голые слова
   подряд. Поэтому знаки ставит сам кабинет — от мастера ничего не требуется,
   говорить надо обычным голосом.

   Работают три вещи разом.

   1. Паузы. Распознавание отмечает, где человек замолчал. Каждый такой
      кусок становится отдельным предложением: большая буква, точка в конце.

   2. Правила русского языка. Запятая ставится перед союзами и союзными
      словами, где она нужна почти всегда: «но», «а», «что», «чтобы»,
      «если», «когда», «который», «потому что», «так как». Вводные слова
      («конечно», «кстати», «например», «во-первых») выделяются с двух
      сторон. Это не догадки о смысле, а те случаи, где запятая стоит
      по правилу.

   3. Названные вслух знаки — если мастер всё-таки хочет поставить что-то
      сам: «точка», «запятая», «тире», «с новой строки». Это не обязанность,
      а возможность.

   В формуле окрашивания ничего этого нет: там «точка» — это точка в тоне,
   «семь точка один», и любой знак сломал бы разбор по полям. */

var SPOKEN_MARKS = [
  [['точка','с','запятой'], ';'],
  [['вопросительный','знак'], '?'],
  [['восклицательный','знак'], '!'],
  [['знак','вопроса'], '?'],
  [['восклицательный'], '!'],
  [['вопросительный'], '?'],
  [['с','новой','строки'], '\n'],
  [['новая','строка'], '\n'],
  [['новый','абзац'], '\n'],
  [['с','красной','строки'], '\n'],
  [['абзац'], '\n'],
  [['двоеточие'], ':'],
  [['запятая'], ','],
  [['точка'], '.'],
  [['тире'], ' —'],
  [['многоточие'], '…']
];

/* Перед этими словами запятая нужна почти всегда. Слова взяты только те,
   где правило не зависит от смысла фразы: подчинительные союзы, союзные
   слова и противительные союзы. «И», «или», «да» сюда не входят — там
   запятая зависит от строения предложения, и угадывать её нельзя. */
var COMMA_BEFORE = {
  'но':1,'зато':1,'однако':1,'а':1,'поэтому':1,'причём':1,'причем':1,
  'что':1,'чтобы':1,'чтоб':1,'если':1,'когда':1,'пока':1,'хотя':1,'чем':1,
  'будто':1,'словно':1,'поскольку':1,'ибо':1,'дабы':1,
  'который':1,'которая':1,'которое':1,'которые':1,'которого':1,'которой':1,
  'которых':1,'которым':1,'которыми':1,'котором':1,'которому':1,'которую':1,
  'где':1,'куда':1,'откуда':1,'зачем':1,'почему':1,'кто':1,'кого':1,'кому':1
};

/* Двухсловные союзы: запятая идёт перед первым словом, а не между ними. */
var COMMA_PAIRS = [['потому','что'],['так','как'],['для','того'],['то','есть'],
                   ['несмотря','на'],['в','случае'],['в','отличие'],['при','условии']];

/* Сравнительный оборот: запятая перед «как» ставится после «так же»,
   «такой же», «то же» — там она нужна по правилу. В остальных случаях
   «как» трогать нельзя: «как обычно», «как в прошлый раз» пишутся без неё. */
var BEFORE_KAK = ['так же','такой же','такая же','такое же','такие же','то же','тот же'];

/* ---- как узнаётся вопрос ----

   Речь на слух отличает вопрос интонацией, в тексте её нет. Поэтому вопрос
   узнаётся по трём приметам, и каждая проверена на живых фразах мастера.

   1. Слова, после которых идёт только вопрос: «почему», «зачем», «сколько»,
      «разве». Тут гадать не о чем.
   2. Слова, которые бывают и в вопросе, и в обычной фразе: «как», «что»,
      «где», «когда», «кто», «какой». Вопрос из них получается, только если
      дальше в фразе есть глагол: «Как мы её красили» — вопрос, «Как обычно
      на корни» — нет.
   3. Обращение к человеку: глагол на «-ешь», «-ишь» («не помнишь»,
      «сделаешь»). В заметке себе так не пишут — только спрашивают.

   Плюс частица «ли»: «Придёт ли она в пятницу». */
var ASK_STRONG = {'почему':1,'зачем':1,'отчего':1,'разве':1,'неужели':1,
                  'сколько':1,'откуда':1,'куда':1,'чей':1,'чья':1,'чьи':1};

var ASK_SOFT = {'как':1,'что':1,'чего':1,'чем':1,'где':1,'когда':1,
                'кто':1,'кого':1,'кому':1,'кем':1,
                'какой':1,'какая':1,'какое':1,'какие':1,'каком':1,'какую':1,'каких':1};

/* Глагол без словаря. Проверка нестрогая — под неё попадают и «цвет», и
   «клиент», — но применяется она только там, где фраза уже начинается с
   вопросительного слова. В остальных случаях она не спрашивается вовсе. */
function looksVerb(w){
  if(/(ешь|ишь|ёшь|ешься|ишься)$/.test(w)) return true;
  if(/(ть|ться|тся)$/.test(w) && w.length >= 5) return true;
  if(/(л|ла|ло|ли|лся|лись)$/.test(w) && w.length >= 3) return true;
  if(/(ет|ёт|ит|ут|ют|ат|ят)$/.test(w) && w.length >= 4) return true;
  return false;
}

function looksQuestion(words){
  if(!words.length) return false;
  if(ASK_STRONG[words[0]]) return true;
  if(words.slice(1).indexOf('ли') >= 0) return true;
  for(var i = 0; i < words.length; i++){
    if(/(ешь|ишь|ёшь|ешься|ишься)$/.test(words[i])) return true;
  }
  if(ASK_SOFT[words[0]] || (words[0] === 'а' && ASK_SOFT[words[1] || ''])){
    for(var j = 0; j < words.length; j++) if(looksVerb(words[j])) return true;
  }
  return false;
}

/* Вводные слова — выделяются с обеих сторон. */
var PARENTHETIC = ['конечно','наверное','наверно','возможно','кажется','кстати',
                   'например','во-первых','во-вторых','в-третьих','значит',
                   'впрочем','словом','пожалуй','видимо','по-моему','правда',
                   'к сожалению','к счастью','в общем','в принципе','по сути'];

function bareWord(w){
  return String(w).toLowerCase().replace(/^[^а-яёa-z]+|[^а-яёa-z-]+$/gi, '');
}

/* Одна порция речи между паузами превращается в предложение:
   знаки, названные вслух → расстановка запятых по правилам → большая буква. */
function speechPiece(raw){
  var words = String(raw).trim().split(/\s+/).filter(Boolean);

  /* шаг 1: слова-знаки становятся знаками */
  var toks = [];
  for(var i = 0; i < words.length; i++){
    var hit = null;
    for(var m = 0; m < SPOKEN_MARKS.length && !hit; m++){
      var pat = SPOKEN_MARKS[m][0], ok = true;
      for(var k = 0; k < pat.length; k++){
        if(bareWord(words[i + k] || '') !== pat[k]){ ok = false; break; }
      }
      if(ok){ hit = SPOKEN_MARKS[m]; i += pat.length - 1; }
    }
    toks.push(hit ? { mark: hit[1] } : { w: words[i] });
  }

  /* шаг 2: запятые по правилам */
  var out = [];
  function lastIsMark(){
    for(var q = out.length - 1; q >= 0; q--){
      if(out[q].mark !== undefined) return true;
      return false;
    }
    return true;                                   /* начало куска */
  }
  function wordsSoFar(){
    var n = 0; out.forEach(function(t){ if(t.w !== undefined) n++; }); return n;
  }
  function put(t){ out.push(t); }
  function comma(){ if(wordsSoFar() && !lastIsMark()) put({ mark: ',' }); }

  for(var j = 0; j < toks.length; j++){
    if(toks[j].mark !== undefined){ put(toks[j]); continue; }
    var w = bareWord(toks[j].w);
    var next = toks[j + 1] && toks[j + 1].w !== undefined ? bareWord(toks[j + 1].w) : '';
    var two = w + ' ' + next;

    /* двухсловный вводный оборот */
    if(PARENTHETIC.indexOf(two) >= 0){
      comma(); put(toks[j]); put(toks[j + 1]); put({ mark: ',' }); j++; continue;
    }
    /* двухсловный союз: запятая перед первым словом */
    var pair = COMMA_PAIRS.filter(function(p){ return p[0] === w && p[1] === next; })[0];
    if(pair){ comma(); put(toks[j]); put(toks[j + 1]); j++; continue; }

    if(PARENTHETIC.indexOf(w) >= 0){ comma(); put(toks[j]); put({ mark: ',' }); continue; }

    /* «так же, как сегодня» — запятая нужна; «как обычно» — нет */
    if(w === 'как'){
      var prev1 = '', prev2 = '', seen = 0;
      for(var q = out.length - 1; q >= 0 && seen < 2; q--){
        if(out[q].w === undefined) break;
        if(seen === 0) prev1 = bareWord(out[q].w); else prev2 = bareWord(out[q].w);
        seen++;
      }
      if(BEFORE_KAK.indexOf(prev2 + ' ' + prev1) >= 0) comma();
      put(toks[j]); continue;
    }

    /* Хвостик-обращение: «…приходила, не помнишь?», «…брали, не знаешь?».
       Запятая нужна перед всем оборотом, а не внутри него. */
    if(w === 'не' && /(ешь|ишь|ёшь)$/.test(next)){
      comma(); put(toks[j]); put(toks[j + 1]); j++; continue;
    }
    /* «а что если», «что если» — оборот целиком, запятые внутри не ставятся */
    var prevW = '';
    for(var z = out.length - 1; z >= 0; z--){ if(out[z].w !== undefined){ prevW = bareWord(out[z].w); } break; }
    if((w === 'что' && next === 'если') || (w === 'если' && prevW === 'что')){ put(toks[j]); continue; }

    if(COMMA_BEFORE[w]) comma();
    put(toks[j]);
  }

  /* шаг 3: собираем строку */
  var s = '';
  out.forEach(function(t){
    if(t.mark !== undefined){ s = s.replace(/\s+$/, '') + t.mark; return; }
    s += (s && !/[\n]$/.test(s) ? ' ' : '') + t.w;
  });
  s = s.replace(/\s+([,.;:!?…])/g, '$1')
       /* пробел нужен между словами, но не внутри числа:
          «пропорция 1:1», «оксид 1,5 %», «пришла в 10:30» */
       .replace(/([,;:])(?=[^\s\d])/g, '$1 ')
       .replace(/(\D)([,;:])(?=\d)/g, '$1$2 ')
       .replace(/,\s*(?=[,.;:!?…])/g, '')          /* запятая перед другим знаком не нужна */
       .replace(/\s*\n\s*/g, '\n').trim();
  if(!s) return '';
  if(!/[.!?…]$/.test(s)){
    var ws = s.toLowerCase().split(/\s+/).map(bareWord).filter(Boolean);
    s += looksQuestion(ws) ? '?' : '.';
  }
  /* большая буква в начале куска и после каждого законченного предложения */
  return s.replace(/(^|[.!?…]\s+|\n)([а-яёa-z])/g, function(all, before, ch){
    return before + ch.toUpperCase();
  });
}

/* Числительные телефона считаются отдельно от формулы: тут нужны сотни
   («девятьсот двенадцать» — это 912, а не 900 и 12), а в формуле сотен нет
   и лишние слова там только мешали бы. */
var PHONE_NUM = {
  'ноль':0,'нуль':0,'один':1,'одна':1,'два':2,'две':2,'три':3,'четыре':4,'пять':5,
  'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10,'одиннадцать':11,'двенадцать':12,
  'тринадцать':13,'четырнадцать':14,'пятнадцать':15,'шестнадцать':16,'семнадцать':17,
  'восемнадцать':18,'девятнадцать':19,'двадцать':20,'тридцать':30,'сорок':40,'пятьдесят':50,
  'шестьдесят':60,'семьдесят':70,'восемьдесят':80,'девяносто':90,
  'сто':100,'двести':200,'триста':300,'четыреста':400,'пятьсот':500,
  'шестьсот':600,'семьсот':700,'восемьсот':800,'девятьсот':900
};

/* «плюс семь девятьсот двенадцать триста сорок пять» → «+7 912 345».
   Номер, набранный пальцем, не трогается: слов в нём нет, а ломать
   расставленные вручную скобки и дефисы незачем. */
/* «+7», оставленное подсказкой и не дополненное, номером не считается */
function phoneEmpty(s){
  return !/[0-9]/.test(String(s).replace(/^\s*\+?\s*7\s*/, ''));
}

function tidyPhone(text){
  var s = String(text || '').trim();
  if(!/[а-яё]/i.test(s)) return phoneEmpty(s) ? '' : s;

  var words = s.toLowerCase().split(/[^0-9a-zа-яё+]+/).filter(Boolean);
  /* каждый кусок помечается: сложился он из одного слова-цифры или нет */
  var out = [], group = null, last = 0, single = false;

  function closeGroup(){
    if(group !== null){ out.push({ t:String(group), one:single }); group = null; last = 0; }
  }

  words.forEach(function(w){
    if(w === 'плюс' || w === '+'){ closeGroup(); out.push({ t:'+', one:false }); return; }
    /* уже готовые цифры, в том числе с плюсом впереди — «+7» из подсказки */
    if(/^\+?[0-9]+$/.test(w)){ closeGroup(); out.push({ t:w, one:false }); return; }
    if(!PHONE_NUM.hasOwnProperty(w)){ closeGroup(); return; }  /* слово не про число */
    var v = PHONE_NUM[w];
    /* Число продолжается, только если предыдущая часть — круглая сотня или
       круглый десяток: «девятьсот двенадцать» — 912, «сорок пять» — 45.
       После «двенадцати» или «пяти» дальше идёт уже новая часть номера,
       поэтому «двенадцать три» — это 12 и 3, а не 15. */
    var canGo = (last >= 100 && last % 100 === 0) || (last >= 20 && last % 10 === 0);
    if(group === null || !canGo || v >= last){ closeGroup(); group = v; single = (v < 10); }
    else { group += v; single = false; }
    last = v;
  });
  closeGroup();

  /* «три четыре пять», названные по одной, — это один кусок номера */
  var glued = [];
  out.forEach(function(x){
    var prev = glued[glued.length - 1];
    if(x.one && prev && prev.one){ prev.t += x.t; }
    else glued.push({ t:x.t, one:x.one });
  });

  var done = glued.map(function(x){ return x.t; }).join(' ')
                  .replace(/\+\s+/g, '+').replace(/\s+/g, ' ').trim();
  /* в поле уже стояло «+7», а мастер назвала номер целиком, с «плюс семь» —
     код страны не должен удвоиться */
  done = done.replace(/^(\+?7)\s*\+?7(?![0-9])/, '$1');
  return phoneEmpty(done) ? '' : done;
}

/* ================= разбор надиктованной формулы =================

   Диктовка приходит без запятых и почти всегда словами: «эстель семь точка
   один на корни оксид шесть процентов один к одному выдержка тридцать пять
   минут». Разбор идёт в три шага.

   1. Числа словами превращаются в цифры, «тридцать четыре» склеивается в 34,
      «точка» между цифрами становится точкой, «процентов» — знаком процента.
   2. В получившейся строке ищутся опорные слова. Опорное слово открывает
      кусок, который тянется до следующего опорного слова, — так становится
      известно, к какому полю относится значение.
   3. То, что опорного слова не получило, добирается по всему тексту:
      пропорция, выдержка, граммовка, жалоба.

   На `\b` в русских выражениях опираться нельзя — с кириллицей граница слова
   не срабатывает. Везде, где нужна граница, стоит `(^|[^а-яё])`. */

var BRANDS = ['Estel','Wella','Schwarzkopf','Matrix','Kapous','L’Oreal'];
var OXIDES = ['3 %','6 %','9 %','12 %'];
var RATIOS = ['1:1','1:1.5','1:2'];
var ZONES  = ['корни','длина','концы','вся длина','корни и длина'];
var TECHS  = ['классика','балаяж','шатуш','AirTouch','мелирование фольгой','открытая техника'];

var NUMW = {
  'ноль':0,'нуль':0,'один':1,'одна':1,'одно':1,'два':2,'две':2,'три':3,'четыре':4,'пять':5,
  'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10,'одиннадцать':11,'двенадцать':12,
  'тринадцать':13,'четырнадцать':14,'пятнадцать':15,'шестнадцать':16,'семнадцать':17,
  'восемнадцать':18,'девятнадцать':19,'двадцать':20,'тридцать':30,'сорок':40,'пятьдесят':50,
  'шестьдесят':60,'семьдесят':70,'восемьдесят':80,'девяносто':90,'сто':100,
  /* косвенные падежи: «на трёх», «на шести», «на полутора», «один к одному» */
  'одному':1,'одного':1,'двум':2,'двух':2,'трём':3,'трем':3,'трёх':3,'трех':3,
  'четырём':4,'четырем':4,'четырёх':4,'четырех':4,'пяти':5,'шести':6,'семи':7,
  'восьми':8,'девяти':9,'десяти':10,'двенадцати':12,'двадцати':20,'тридцати':30,'сорока':40,
  'полтора':1.5,'полторы':1.5,'полутора':1.5
};
var TENS = {'20':1,'30':1,'40':1,'50':1,'60':1,'70':1,'80':1,'90':1};

function bare(w){ return String(w).toLowerCase().replace(/^[^0-9a-zа-яё%]+|[^0-9a-zа-яё%]+$/gi, ''); }

function normNums(text){
  var words = String(text).toLowerCase().split(/\s+/).filter(Boolean);
  var out = [];
  words.forEach(function(w){
    var b = bare(w);
    out.push(NUMW.hasOwnProperty(b) ? String(NUMW[b]) : w);
  });
  /* «тридцать четыре» → 34, «сто двадцать» → 120: склеиваются только
     сотня с десятком и круглый десяток с единицей, тоны это не задевает */
  function glue(list){
    var m = [];
    for(var i = 0; i < list.length; i++){
      var a = bare(list[i]), b = (i + 1 < list.length) ? bare(list[i+1]) : '';
      var join = (TENS[a] && /^[1-9]$/.test(b)) ||
                 (a === '100' && /^[1-9][0-9]?$/.test(b) && +b <= 99);
      if(join){ m.push(String(+a + +b)); i++; }
      else m.push(list[i]);
    }
    return m;
  }
  var merged = glue(glue(out));
  var s = merged.join(' ');
  s = s.replace(/(\d)\s+точка\s+(\d)/g, '$1.$2');
  s = s.replace(/(\d)\s+запятая\s+(\d)/g, '$1.$2');
  s = s.replace(/(\d)\s*процент[а-яё]*/g, '$1 %');
  s = s.replace(/(\d)\s*%/g, '$1 %');
  s = s.replace(/[,;]/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

/* опорное слово → поле. Порядок важен: длинные фразы проверяются первыми */
var ANCHORS = [
  ['тон корней','root'], ['на корнях','root'], ['на корни','root'], ['корневая зона','root'],
  ['корни','root'], ['корней','root'], ['корнях','root'], ['корням','root'],
  ['по всей длине','zonesAll'], ['вся длина','zonesAll'], ['всю длину','zonesAll'],
  ['тон длины','len'], ['по длине','len'], ['на длину','len'], ['на длине','len'],
  ['длина','len'], ['длину','len'], ['длине','len'], ['длины','len'],
  ['концы','zonesEnds'], ['кончики','zonesEnds'],
  ['оксид','oxide'], ['оксиде','oxide'], ['окислитель','oxide'], ['окислителе','oxide'], ['активатор','oxide'],
  ['на 1.5','oxideShort'], ['на 3','oxideShort'], ['на 6','oxideShort'], ['на 9','oxideShort'], ['на 12','oxideShort'],

  ['выдержка','hold'], ['выдержку','hold'], ['выдержке','hold'],

  ['классика','techClassic'], ['классику','techClassic'], ['классикой','techClassic'],
  ['балаяж','techBal'], ['шатуш','techShat'], ['airtouch','techAir'], ['air touch','techAir'],
  ['аиртач','techAir'], ['эйртач','techAir'], ['эиртач','techAir'],
  ['техника','tech'], ['технику','tech'], ['техникой','tech'],
  ['осветление','bleach'], ['осветлила','bleach'], ['осветляла','bleach'], ['обесцвечивание','bleach'],
  ['порошок','bleachPowder'], ['порошком','bleachPowder'], ['пудра','bleachPowder'], ['пудрой','bleachPowder'],
  ['тонирование','toneAfter'], ['тонировала','toneAfter'], ['тонировку','toneAfter'], ['тонировка','toneAfter'],
  ['было до','before'], ['до этого','before'], ['свой цвет','beforeOwn'], ['натуральный','beforeOwn'],
  ['седина','beforeGrey'], ['седины','beforeGrey'], ['окрашено','before'], ['крашено','before'],
  ['результат','result'], ['получилось','result'], ['попали в тон','resultHit'],
  ['грамм','grams'], ['граммов','grams'], ['грамма','grams'], ['расход','grams'],
  ['отросли','rootsDays'], ['отрасли','rootsDays'], ['отросло','rootsDays'],
  ['вымылся','toneDays'], ['смылся','toneDays'], ['слетел','toneDays'], ['потускнел','toneDays'],
  ['жалоба','complaint'], ['жалоб','complaint'], ['жалоба нет','complaint'],
  ['пятна','complaintSpots'], ['пятнами','complaintSpots'],
  ['пожелтение','complaintYellow'], ['пожелтел','complaintYellow'], ['желтизна','complaintYellow'],
  ['повреждение','complaintDamage'], ['ломается','complaintDamage'], ['сожгли','complaintDamage'],
  ['переделка','redo'], ['переделки','redo'], ['переделок','redo'],
  ['переделывала','redo'], ['переделали','redo'], ['переделала','redo'],
  ['estel','brand'], ['estelle','brand'], ['эстель','brand'],
  ['wella','brand'], ['vella','brand'], ['велла','brand'],
  ['schwarzkopf','brand'], ['шварцкопф','brand'], ['matrix','brand'], ['матрикс','brand'],
  ['kapous','brand'], ['капус','brand'], ['loreal','brand'], ['лореаль','brand'], ['лореал','brand'],
  ['ollin','brand'], ['оллин','brand'], ['concept','brand'], ['концепт','brand'],
  ['londa','brand'], ['лонда','brand'], ['igora','brand'], ['игора','brand']
].sort(function(a, b){ return b[0].split(' ').length - a[0].split(' ').length; });

/* Телефон часто сам пишет марку латиницей — и пишет её на свой лад:
   «Vella», «Estelle», «Loreal». Это та же краска, поэтому все ходовые
   написания сведены к одному правильному — тому, что напечатано на тубе. */
var BRAND_OF = {
  'estel':'Estel','estelle':'Estel','estell':'Estel','эстель':'Estel','эстел':'Estel',
  'wella':'Wella','vella':'Wella','vela':'Wella','wela':'Wella',
  'велла':'Wella','вела':'Wella','уэлла':'Wella',
  'schwarzkopf':'Schwarzkopf','shwarzkopf':'Schwarzkopf','schwarzkopff':'Schwarzkopf',
  'шварцкопф':'Schwarzkopf','шварцкоф':'Schwarzkopf',
  'matrix':'Matrix','матрикс':'Matrix',
  'kapous':'Kapous','kapus':'Kapous','капус':'Kapous','капус':'Kapous',
  'loreal':'L’Oreal','lorealle':'L’Oreal','loreale':'L’Oreal',
  'лореаль':'L’Oreal','лореал':'L’Oreal','лорэаль':'L’Oreal',
  'ollin':'Ollin','оллин':'Ollin','олин':'Ollin',
  'concept':'Concept','концепт':'Concept',
  'londa':'Londa','лонда':'Londa',
  'igora':'Igora','игора':'Igora',
  'selective':'Selective','селектив':'Selective','селективе':'Selective',
  'constant':'Constant Delight','констант':'Constant Delight'
};

/* убираем из куска то, что тоном быть не может: проценты, минуты, граммы, дни */
function stripUnits(s){
  return String(s)
    .replace(/\d+(?:[.,]\d+)?\s*%/g, ' ')
    .replace(/\d+\s*мин[а-яё]*/g, ' ')
    .replace(/\d+\s*(?:грамм[а-яё]*|гр|г)(?![а-яёa-z])/g, ' ')
    .replace(/\d+\s*(?:дн[а-яё]*|день|недел[а-яё]*)/g, ' ')
    .replace(/\d{1,2}\s*(?::|к)\s*\d{1,2}(?:[.,]\d)?/g, ' ')
    .replace(/\s+/g, ' ').trim();
}
function tone(s){
  s = stripUnits(s);
  var m = s.match(/(\d{1,2})[.,](\d{1,3})/);
  if(m) return m[1] + '.' + m[2];
  m = s.match(/(?:^|[^\d.])(\d{1,2})\s+(\d{1,2})(?![\d.])/);
  if(m && +m[1] <= 12) return m[1] + '.' + m[2];
  m = s.match(/(?:^|[^\d.])(\d{1,2})(?![\d.])/);
  if(m && +m[1] <= 12) return m[1];
  return '';
}
/* тон из куска уже забрали — остальное отдаём добору */
function dropTone(s, t){
  if(!t) return s;
  var esc2 = t.replace('.', '[.,]?\\s*');
  return String(s).replace(new RegExp(esc2), ' ').replace(/\s+/g, ' ').trim();
}
function firstNum(s){
  var m = String(s).match(/(\d{1,3}(?:[.,]\d+)?)/);
  return m ? m[1].replace(',', '.') : '';
}

/* Текст режется на куски: опорное слово открывает кусок, кусок тянется
   до следующего опорного слова. Так значение всегда знает своё поле. */
function chunks(text){
  var words = text.split(/\s+/).filter(Boolean);
  var res = [], head = [], cur = null, i = 0;
  while(i < words.length){
    var hit = null;
    for(var k = 0; k < ANCHORS.length; k++){
      var n = ANCHORS[k][0].split(' ').length;
      if(i + n > words.length) continue;
      if(words.slice(i, i + n).map(bare).join(' ') === ANCHORS[k][0]){ hit = ANCHORS[k]; break; }
    }
    if(hit){
      if(cur) res.push(cur);
      cur = { field:hit[1], word:hit[0], text:[] };
      i += hit[0].split(' ').length;
    } else {
      if(cur) cur.text.push(words[i]); else head.push(words[i]);
      i++;
    }
  }
  if(cur) res.push(cur);
  res.forEach(function(c){ c.text = c.text.join(' ').replace(/^[\s:,-]+|[\s:,-]+$/g, ''); });
  return { head: head.join(' ').replace(/^[\s:,-]+|[\s:,-]+$/g, ''), list: res };
}

function parseStory(text){
  var res = { card:{}, rootsDays:null, toneDays:null, complaint:null, redo:null, rest:[] };
  var norm = normNums(text);
  var ch = chunks(norm);
  var k = res.card;
  var pendingTone = '', prevField = '', zones = [];

  if(ch.head){
    var t0 = tone(ch.head);
    if(t0) pendingTone = t0; else res.rest.push(ch.head);
  }

  ch.list.forEach(function(c, ci){
    var v = c.text, low = ' ' + v.toLowerCase() + ' ', taken = true, tv;
    var prev = ci ? ch.list[ci-1] : null;
    switch(c.field){
      case 'brand':
        if(!k.brand) k.brand = BRAND_OF[c.word] || c.word;
        tv = tone(v);
        if(tv) pendingTone = tv;
        else if(v) res.rest.push(v);
        break;
      case 'root':
        tv = tone(v);
        k.rootTone = tv || pendingTone || k.rootTone || '';
        if(!tv && pendingTone) pendingTone = '';
        if(k.rootTone) zones.push('корни');
        if(v) res.rest.push(dropTone(v, tv));
        break;
      case 'len':
        tv = tone(v);
        k.lenTone = tv || pendingTone || k.lenTone || '';
        if(!tv && pendingTone) pendingTone = '';
        if(k.lenTone) zones.push('длина');
        if(v) res.rest.push(dropTone(v, tv));
        break;
      case 'zonesAll': zones.push('вся длина'); if(v) res.rest.push(v); break;
      case 'zonesEnds': zones.push('концы'); if(v) res.rest.push(v); break;
      case 'oxide': {
        var ox = firstNum(v);
        if(ox){
          k.oxide = ox + ' %';
          var tailOx = v.replace(/\d{1,3}(?:[.,]\d+)?\s*%?/, ' ').replace(/\s+/g, ' ').trim();
          if(tailOx) res.rest.push(tailOx);
        } else if(v) res.rest.push(v);
        break;
      }
      case 'oxideShort': {
        /* «на шести» после осветления или тонирования относится к ним,
           а не к основной краске.

           Но «на девять уровень», «на два тона», «на три часа» — это не оксид.
           Раньше кабинет хватал число сразу за «на» и молча записывал его
           процентом в ту самую карточку, которую через месяц надо повторить
           точно. Теперь смотрим на слово после числа: если оно называет
           не оксид, оборот целиком уходит в «Не поняла». */
        var n = c.word.split(' ')[1];
        var restOx = v.replace(/^%\s*/, '').trim();
        if(/^(уровень|уровня|уровней|уровнях|тон|тона|тонов|час|часа|часов|минут[а-яё]*|зон[а-яё]*|номер[а-яё]*)\b/i.test(restOx)){
          res.rest.push('на ' + n + ' ' + restOx);
          break;
        }
        var toBleach = (prevField === 'bleach' || prevField === 'bleachPowder') && k.bleach;
        if(toBleach){
          k.bleach += ', ' + n + ' %';
          var mm = restOx.match(/(\d{1,3})\s*мин[а-яё]*/);
          if(mm){ k.bleach += ', ' + mm[1] + ' мин'; restOx = restOx.replace(mm[0], '').trim(); }
        }
        else if(prevField === 'toneAfter' && k.toneAfter) k.toneAfter += ' на ' + n + ' %';
        else if(!k.oxide) k.oxide = n + ' %';
        if(restOx) res.rest.push(restOx);
        break;
      }
      case 'ratio': {
        var mr = v.match(/(\d{1,2})\s*(?:к|:)\s*(\d{1,2}(?:\.\d)?)/);
        if(mr) k.ratio = mr[1] + ':' + mr[2];
        else if(v) res.rest.push(v);
        break;
      }
      case 'hold': {
        var hn = firstNum(v);
        if(hn) k.hold = String(Math.round(+hn));
        break;
      }
      case 'grams': {
        /* «шестьдесят грамм» — число стоит перед словом, и его надо
           забрать с хвоста предыдущего куска */
        var g = firstNum(v);
        if(!g){
          var src = (prev ? prev.text : '') || ch.head;
          var mp = String(src).match(/(\d{1,3})\s*$/);
          if(mp) g = mp[1];
        }
        if(g) k.grams = Math.round(+g) + ' г';
        break;
      }
      case 'tech': k.tech = v || k.tech; break;
      case 'techClassic': k.tech = 'классика'; break;
      case 'techBal': k.tech = 'балаяж'; break;
      case 'techShat': k.tech = 'шатуш'; break;
      case 'techAir': k.tech = 'AirTouch'; break;
      case 'techFoil': k.tech = 'мелирование фольгой'; break;
      case 'techOpen': k.tech = 'открытая техника'; break;
      case 'bleach': k.bleach = v || 'да'; break;
      case 'bleachPowder': k.bleach = ('порошок ' + v).trim(); break;
      case 'toneAfter': k.toneAfter = (v ? v.replace(/^(\d{1,2})\s+(\d{1,2})(?=\s|$)/, '$1.$2') : '') || k.toneAfter || 'да'; break;
      case 'before':
        k.before = ((c.word === 'окрашено' || c.word === 'крашено') ? 'окрашено ' : '') + v;
        break;
      case 'beforeOwn': k.before = 'свой цвет' + (v ? ', ' + v : ''); break;
      case 'beforeGrey': k.before = ('седина ' + v).trim(); break;
      case 'result': k.result = v || k.result; break;
      case 'resultHit': k.result = 'попали в тон' + (v ? ', ' + v : ''); break;
      case 'rootsDays': {
        var rd = firstNum(v) || firstNum(ch.head);
        if(rd) res.rootsDays = Math.round(+rd);
        break;
      }
      case 'toneDays': {
        var td = firstNum(v) || firstNum(ch.head);
        if(td) res.toneDays = Math.round(+td);
        break;
      }
      case 'complaint':
        res.complaint = /(^|[^а-яё])(без|нет|не)([^а-яё]|$)/.test(low) ? '' : (v || 'цвет ушёл');
        break;
      case 'complaintSpots':  res.complaint = 'пятна'; break;
      case 'complaintYellow': res.complaint = 'пожелтение'; break;
      case 'complaintDamage': res.complaint = 'повреждение волоса'; break;
      case 'redo':
        res.redo = !/(^|[^а-яё])(без|не)([^а-яё]|$)/.test(low);
        break;
      default: taken = false;
    }
    if(!taken && v) res.rest.push(v);
    if(c.field !== 'oxideShort') prevField = c.field;
  });

  /* Добор. Идёт только по тому, что опорного слова не получило, — иначе
     минуты осветления попали бы в выдержку основной краски. */
  var pool = (ch.head + ' ' + res.rest.join(' ')).trim();
  if(!k.ratio){
    var mr2 = pool.match(/(?:^|[^\d])(\d{1,2})\s*(?:к|:)\s*(\d{1,2}(?:\.\d)?)(?![\d])/);
    if(mr2) k.ratio = mr2[1] + ':' + mr2[2];
  }
  if(!k.hold){
    var mh = pool.match(/(\d{1,3})\s*мин[а-яё]*/);
    if(mh) k.hold = mh[1];
  }
  if(!k.grams){
    var mg = pool.match(/(\d{1,3})\s*(?:грамм[а-яё]*|гр|г)(?![а-яёa-z])/);
    if(mg) k.grams = mg[1] + ' г';
  }
  if(!k.oxide){
    var mo = pool.match(/(?:^|[^\d.])(1\.5|3|6|9|12)\s*%/);
    if(mo) k.oxide = mo[1] + ' %';
  }
  if(res.complaint == null && /(^|[^а-яё])цвет уш(ё|е)л/.test(norm)) res.complaint = 'цвет ушёл';

  /* тон назвали, а зону — нет: «вся длина» красится одним тоном,
     в остальных случаях это корни, самая частая работа колориста */
  if(pendingTone && !k.rootTone && !k.lenTone){
    if(zones.indexOf('вся длина') >= 0){ k.rootTone = pendingTone; k.lenTone = pendingTone; }
    else k.rootTone = pendingTone;
  }

  /* зоны выводятся из того, что окрашивали: отдельно их диктовать не нужно */
  if(!k.zones){
    if(zones.indexOf('вся длина') >= 0) k.zones = 'вся длина';
    else {
      var uniq = [];
      zones.forEach(function(z){ if(uniq.indexOf(z) < 0) uniq.push(z); });
      if(uniq.length === 2 && uniq.indexOf('корни') >= 0 && uniq.indexOf('длина') >= 0) k.zones = 'корни и длина';
      else if(uniq.length) k.zones = uniq.join(', ');
    }
  }

  res.rest = res.rest.map(function(t){
    if(k.ratio) t = t.replace(/\d{1,2}\s*(?::|к)\s*\d{1,2}(?:[.,]\d)?/g, ' ');
    if(k.hold)  t = t.replace(/\d{1,3}\s*мин[а-яё]*/g, ' ');
    if(k.grams) t = t.replace(/\d{1,3}\s*(?:грамм[а-яё]*|гр|г)(?![а-яёa-z])/g, ' ');
    if(k.oxide) t = t.replace(/\d{1,2}(?:[.,]\d)?\s*%/g, ' ');
    return t.replace(/\s+/g, ' ').trim();
  }).filter(function(t){ return t && t.replace(/[\s,.;:%0-9-]/g, '').length > 1; });
  return res;
}

/* Подсказки под полем: где набор известен заранее — он фиксированный,
   где открытый — собирается из того, что мастер уже вписывал раньше.
   Само поле остаётся открытым, свои значения и голос работают как прежде. */
function usedValues(field, limit){
  var count = {};
  DB.appts.forEach(function(a){
    var v = a.card && a.card[field];
    if(!v) return;
    v = String(v).trim(); if(!v) return;
    count[v] = (count[v] || 0) + 1;
  });
  return Object.keys(count)
    .sort(function(x, y){ return count[y] - count[x] || (x < y ? -1 : 1); })
    .slice(0, limit || 6);
}

/* невидимый разделитель: имя поля и значение уезжают в один data-id */
var SEP = String.fromCharCode(1);

function hintRow(field, values){
  if(!values.length) return '';
  return '<div class="chip-row hints">' + values.map(function(v){
    return '<button type="button" class="chip" data-act="setField" data-id="' +
           field + SEP + esc(v) + '">' + esc(v) + '</button>';
  }).join('') + '</div>';
}

var CARD_FIELDS = ['brand','rootTone','lenTone','oxide','ratio','hold','grams',
                   'zones','tech','bleach','toneAfter','before','result'];

function editCard(id){
  var a = apptById(id); if(!a) return;
  var k = a.card || {};
  function f(name, label, value, ph, hints){
    return '<div class="field"><label class="lab">' + label + '</label>' +
           '<input class="inp" id="k_' + name + '" value="' + esc(value || '') + '" placeholder="' + esc(ph || '') + '">' +
           hintRow(name, hints || []) + '</div>';
  }
  var cSel = ['', 'цвет ушёл', 'пятна', 'пожелтение', 'повреждение волоса'].map(function(v){
    return '<option value="' + esc(v) + '"' + ((a.complaint || '') === v ? ' selected' : '') + '>' +
           (v || 'нет') + '</option>';
  }).join('');

  var h =
    '<div class="note">Через месяц клиент скажет «как в прошлый раз» — повторить надо будет точно. ' +
      'Ради этого здесь всё и записывается.</div>' +
    voiceBlock('Расскажите свободно — потом разложим по полям',
      'Например:\nэстель семь точка один на корни\nоксид шесть процентов пропорция один к одному\n' +

/* подсвечиваем подсказку, совпадающую с тем, что уже стоит в поле */
function markHints(){
  var rows = document.querySelectorAll('.chip-row.hints');
  for(var i = 0; i < rows.length; i++){
    var chips = rows[i].querySelectorAll('.chip');
    for(var j = 0; j < chips.length; j++){
      var parts = chips[j].getAttribute('data-id').split(SEP);
      var inp = $('k_' + parts[0]);
      chips[j].classList.toggle('on', !!inp && inp.value.trim().toLowerCase() === parts[1].toLowerCase());
    }
  }
}

function formAppt(preClient){
  var opts = DB.clients.map(function(c){
    return '<option value="' + c.id + '"' + (c.id === preClient ? ' selected' : '') + '>' + esc(c.name) + '</option>';
  }).join('');
  /* В списке только названия. Время и цена вынесены в свои поля: одна и та же
     стрижка бывает и за 2500, и за 5000, и держать мастера в рамках прайса
     нельзя. Из прайса берётся только начальное значение. */
  var sopts = DB.services.map(function(s){
    return '<option value="' + s.id + '">' + esc(s.name) + '</option>';
  }).join('');
  var first = DB.services[0] || { dur:60, price:0 };
  var h =
    '<div class="field"><label class="lab">Клиент</label><select class="inp" id="f_client">' + opts + '</select></div>' +
    '<div class="field"><label class="lab">Процедура</label><select class="inp" id="f_service">' + sopts + '</select></div>' +

          'value="' + Math.floor(first.dur / 60) + '" style="padding-right:52px">' +
          '<span class="unit">часов</span></div>' +
        '<div style="position:relative"><input class="inp" id="f_m" inputmode="numeric" ' +
          'value="' + (first.dur % 60) + '" style="padding-right:52px">' +
          '<span class="unit">минут</span></div>' +
      '</div></div>' +
    '<div class="busy" id="f_busy"></div>' +
    '<div class="field"><label class="lab">Стоимость, ₽</label>' +
      '<input class="inp" id="f_price" inputmode="numeric" value="' + first.price + '"></div>' +

    '<div class="hintline">Время и стоимость подставились из прайса — поправьте под этот приём, ' +
    'если он длиннее или дороже обычного.</div>';
  openSheet('Новая запись', h,
    '<button class="btn primary" data-act="saveAppt">Сохранить запись</button>' +
    '<button class="btn ghost" data-act="closeSheet">Отмена</button>');

  /* Сменили процедуру — время и цена подставляются заново, но только те,
     которых мастер ещё не касалась. Раньше флаг был один на всё: поправишь
     цену — и балаяж запишется на час от стрижки, поправишь минуты —
     и цена останется стрижкина. */
  var setDur = false, setPrice = false;
  ['f_h', 'f_m'].forEach(function(fid){
    var el = $(fid); if(el) el.addEventListener('input', function(){ setDur = true; });
  });
  var pr = $('f_price');
  if(pr) pr.addEventListener('input', function(){ setPrice = true; });
  var sel = $('f_service');
  if(sel) sel.addEventListener('change', function(){
    var s = svc(sel.value);
    if(s){
      if(!setDur){ $('f_h').value = Math.floor(s.dur / 60); $('f_m').value = s.dur % 60; }
      if(!setPrice){ $('f_price').value = s.price; }
    }
    paintBusy();
  });

  /* Занятость показывается сразу, пока мастер выбирает время: приём на
     четыре часа перекрывает половину дня, и узнавать об этом после
     сохранения поздно. */
  function paintBusy(){
    var box = $('f_busy'); if(!box) return;
    var d = (parseInt(val('f_h'), 10) || 0) * 60 + (parseInt(val('f_m'), 10) || 0);
    var r = busyLine({ id:'', date: val('f_date'), time: val('f_time'), dur: d });
    box.className = 'busy' + (r.free ? ' free' : ' hit');
    box.textContent = r.text;
  }
  ['f_date', 'f_time', 'f_h', 'f_m'].forEach(function(fid){
    var el = $(fid); if(el){ el.addEventListener('input', paintBusy); el.addEventListener('change', paintBusy); }
  });
  paintBusy();
}

function doStart(a){
  snapshot();
  DB.appts.forEach(function(x){ if(x.status === 'running'){ x.status = 'plan'; x.startedAt = null; } });
  a.status = 'running';
  /* приём вчерашнего дня отсчитывается от времени записи, а не от «сейчас»:
     иначе кабинет показал бы «идёт 26 часов» */
  a.startedAt = (a.date === today()) ? Date.now() : null;
  save(); closeSheet(); render();
  toast(a.date === today() ? 'Приём начат' : 'Приём отмечен задним числом — не забудьте «Завершить»');
}

/* Три письма вместо одного: подтверждение сразу после записи, напоминание
   накануне и приглашение вернуться. Текст собирается из самой записи,
   вписывать дату и время руками не нужно. */
function msgText(kind, obj){
  var place = (DB.settings.place || '').trim();
  var tail = place ? ' Адрес: ' + place + '.' : '';
  if(kind === 'invite'){
    var c0 = obj, d = dueInfo(c0), what;
    if(d.why.length === 2) what = 'пора обновить корни и освежить стрижку';
    else if(d.why[0] === 'корни') what = 'пора обновить корни';
    else if(d.why[0] === 'стрижка') what = 'пора освежить стрижку';
    else what = 'давно не виделись';
    return 'Здравствуйте, ' + firstName(c0) + '! По моим записям ' + what + ' — подберём удобное время?';
  }
  var a = obj, c = cli(a.clientId), sName = workName(a);
  if(kind === 'confirm'){
    return 'Здравствуйте, ' + firstName(c) + '! Записала вас на ' + dateAcc(a.date) +
           ', ' + a.time + '. ' + sName + ', ' + dur(a.dur) + ', ' + rub(a.price) + '.' + tail +
           ' Если планы изменятся, напишите, пожалуйста, заранее.';
  }
  return 'Здравствуйте, ' + firstName(c) + '! Напоминаю: завтра в ' + a.time + ' — ' +
         sName.toLowerCase() + ', ' + dur(a.dur) + '.' + tail + ' Всё в силе?';
}

var KIND_TITLE = { confirm:'Подтверждение записи', remind:'Напоминание накануне', invite:'Приглашение вернуться' };

/* Отметка ставится в момент, когда мастер выбрал способ связи: она означает
   «я отправила», а не «клиент ответил». Лишнего касания не требуется. */
function markSent(kind, apptId){
  var a = apptById(apptId); if(!a) return;
  var f = (kind === 'confirm') ? 'sentConfirm' : 'sentRemind';
  if(a[f]) return;
  snapshot(); a[f] = today(); save();
}

function sendSheet(kind, id){
  var a = null, c;
  if(kind === 'invite'){ c = cli(id); }
  else { a = apptById(id); if(!a) return; c = cli(a.clientId); }

  var body = msgText(kind, kind === 'invite' ? c : a);
  var text = encodeURIComponent(body);
  var digits = (c.phone || '').replace(/\D/g, '');
  var pref = c.link || '';
  var links = [];
  if(digits) links.push(['WhatsApp', 'https://wa.me/' + digits + '?text=' + text, pref === 'whatsapp']);
  links.push(['Telegram', 'https://t.me/share/url?url=&text=' + text, pref === 'telegram']);
  if(digits) links.push(['СМС', 'sms:+' + digits + '?body=' + text, false]);
  if(digits) links.push(['Позвонить', 'tel:+' + digits, false]);
  /* основной способ связи из карточки клиента — первым */
  links.sort(function(x, y){ return (y[2] ? 1 : 0) - (x[2] ? 1 : 0); });

  var mark = (kind === 'invite') ? '' : ' data-sent="' + kind + '" data-appt="' + a.id + '"';
  var h = '<div class="card"><div style="font-size:13px;line-height:1.55">' + esc(body) + '</div></div>' +
          '<div class="list" style="margin-top:12px">' +
          links.map(function(l){
            return '<a class="btn wide' + (l[2] ? ' primary' : '') + '" href="' + l[1] +
                   '" target="_blank" rel="noopener"' + mark + '>' + l[0] + '</a>';
          }).join('') + '</div>';
  if(kind !== 'invite'){
    var f = (kind === 'confirm') ? 'sentConfirm' : 'sentRemind';
    h += a[f]
      ? '<div class="note">Отправлено ' + shortDate(a[f]) + '. Можно отправить ещё раз.</div>'
      : '<div class="note">Как только выберете способ связи, запись отметится как отправленная. ' +
        'Если позвоните по телефону — отметьте кнопкой ниже.</div>';
    if(isColor(a) && needAllergy(c)){
      h += '<div class="note">У клиента впереди первое окрашивание без отметки об аллергопробе. ' +
           'Пробу ставят за 48 часов — предупредите об этом сейчас.</div>';
    }
  }
  var foot = '';
  if(kind !== 'invite'){
    foot += '<button class="btn" data-act="markSent" data-id="' + kind + ':' + a.id + '">Отметить, что сообщила</button>';
  }
  foot += '<button class="btn ghost" data-act="closeSheet">Закрыть</button>';
  openSheet(KIND_TITLE[kind] + ': ' + c.name, h, foot);
}

function writeTo(clientId){ sendSheet('invite', clientId); }

/* ================= резервная копия ================= */
function doBackup(){
  var blob = new Blob([JSON.stringify(DB, null, 1)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  /* копия из примера называется по-другому: иначе в «Загрузках» телефона
     её не отличить от настоящей, и однажды она заменит живые записи */
  a.href = url; a.download = (DEMO ? 'primer-tochka-krasoty-' : 'tochka-krasoty-volosy-') + today() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  /* на первом запуске это учебное нажатие: сохранять базу нельзя, иначе
     кабинет сочтёт выбор сделанным и больше не спросит, с чего начать */
  if(NEED_START){
    toast('Файл копии в загрузках телефона — теперь вы знаете дорогу', true);
    return;
  }
  snapshot(); DB.settings.lastBackup = today(); DB.settings.backupSnoozed = null; save();
  toast('Копия сохранена в загрузки телефона');
  closeSheet(); render();
}
/* Файл разбирается и проверяется полностью до того, как база будет заменена.
   Мастер видит, что именно лежит в файле, и подтверждает замену вручную. */
var RESTORE = null;

function doRestore(){
  var inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = function(){
    var f = inp.files && inp.files[0]; if(!f) return;
    var r = new FileReader();
    r.onerror = function(){ toast('Файл не прочитался. Попробуйте выбрать его заново', true); };
    r.onload = function(){ checkRestore(r.result, f.name); };
    r.readAsText(f);
  };
  inp.click();
}

function checkRestore(text, fname){
  var obj;
  try{ obj = JSON.parse(text); }
  catch(e){ toast('Это не файл копии кабинета: содержимое не читается', true); return; }
  if(!obj || typeof obj !== 'object' || Array.isArray(obj)){
    toast('Это не файл копии кабинета', true); return;
  }
  /* обязательные разделы: без них файл принадлежит не этому кабинету */
  var need = [['clients','клиенты'], ['appts','приёмы'], ['services','процедуры']];
  var missing = [];
  need.forEach(function(p){ if(!Array.isArray(obj[p[0]])) missing.push(p[1]); });
  if(missing.length === need.length){
    toast('Это не файл копии кабинета «Точка красоты. Волосы»', true);
    return;
  }
  if(missing.length){
    toast('Файл не подошёл: нет разделов «' + missing.join('», «') + '»', true);
    return;
  }
  /* необязательные разделы восполняются, замена из-за них не отменяется */
  var filled = [];
  if(!Array.isArray(obj.stock)){ obj.stock = []; filled.push('материалы'); }
  if(!Array.isArray(obj.clean)){ obj.clean = []; filled.push('дезинфекция'); }
  if(!Array.isArray(obj.notes)){ obj.notes = []; filled.push('заметки'); }
  if(!obj.settings || typeof obj.settings !== 'object'){
    obj.settings = { theme:'light', installHidden:false, workStart:'09:00', workEnd:'21:00', lastBackup:null };
    filled.push('настройки');
  }
  if(!obj.settings.workStart) obj.settings.workStart = '09:00';
  if(!obj.settings.workEnd) obj.settings.workEnd = '21:00';
  if(!obj.settings.theme) obj.settings.theme = DB.settings.theme || 'light';
  obj.clients.forEach(function(c){
    if(c.cycleRoots === undefined) c.cycleRoots = c.cycle || null;
    if(c.cycleCut === undefined) c.cycleCut = c.cycle ? Math.round(c.cycle * 1.6) : null;
    if(c.allergy === undefined) c.allergy = null;
  });

  RESTORE = obj;

  function row(label, was, will){
    return '<div class="kv"><span>' + esc(label) + '</span><b>' + was + ' → ' + will + '</b></div>';
  }
  function withForm(list){
    return list.filter(function(a){
      return a.card && (a.card.brand || a.card.rootTone || a.card.lenTone);
    }).length;
  }
  var h = '<div class="note">Сейчас в кабинете эти записи будут заменены содержимым файла ' +
          esc(fname || 'копии') + '. Проверьте числа.</div>' +
          '<div class="kvs">' +
            row('Клиенты', DB.clients.length, obj.clients.length) +
            row('Приёмы', DB.appts.length, obj.appts.length) +
            row('Записи с формулой', withForm(DB.appts), withForm(obj.appts)) +
            row('Процедуры', DB.services.length, obj.services.length) +
            row('Материалы', DB.stock.length, obj.stock.length) +
            row('Дезинфекция', DB.clean.length, obj.clean.length) +
            row('Заметки', DB.notes.length, obj.notes.length) +
          '</div>';
  if(filled.length){
    h += '<div class="note">' +
         (filled.length === 1
           ? 'В файле нет раздела «' + esc(filled[0]) + '» — он будет создан пустым.'
           : 'В файле нет разделов «' + esc(filled.join('», «')) + '» — они будут созданы пустыми.') +
         '</div>';
  }
  h += '<div class="note">Если числа выглядят неправильно, нажмите «Не заменять». ' +
       'После замены прежние записи можно вернуть кнопкой отмены в шапке.</div>';
  openSheet('Заменить записи из копии?', h,
    '<button class="btn ghost" data-act="restoreCancel">Не заменять</button>' +
    '<button class="btn primary" data-act="restoreApply">Заменить</button>');
}

function restoreApply(){
  if(!RESTORE){ toast('Файл копии не выбран'); return; }
  snapshot();
  DB = RESTORE; RESTORE = null;
  document.documentElement.setAttribute('data-theme', DB.settings.theme || 'light');
  tidyStatuses();
  /* записи вернулись — экрана «выберите, с чего начать» больше быть не должно:
     ближайшая на нём кнопка стёрла бы восстановленное */
  NEED_START = false;
  save(); setTab('today'); render();
  closeSheet();
  toast(DEMO
    ? 'Это пример: записи показаны, но не сохранятся — при следующем открытии вернётся пример'
    : 'Записи заменены. Вернуть прежние — кнопкой отмены в шапке, пока кабинет открыт');
}

function restoreCancel(){
  RESTORE = null;
  closeSheet();
  toast('Замена отменена, записи прежние');
}

/* Приёмы длинные, наложить новую запись на предыдущую легко.
   Кабинет не запрещает — он предупреждает и показывает накладку в ленте дня. */
/* Приёмы у колориста длинные, и наложение — самая частая ошибка при записи.
   Кабинет ищет любой приём того же дня, который пересекается по времени. */
function overlapHit(a){
  var hit = null, st = mins(a.time), en = st + a.dur;
  DB.appts.forEach(function(x){
    if(x.id === a.id || x.date !== a.date || x.status === 'cancel') return;
    var xs = mins(x.time), xe = xs + x.dur;
    if(st < xe && xs < en) hit = x;
  });
  return hit;
}

function overlapWarn(a){
  var hit = overlapHit(a);
  if(!hit) return '';
  return 'Внимание: запись наложилась на приём в ' + hit.time + ' (' + dur(hit.dur) + ')';
}

/* Та же проверка, но словами и заранее — показывается прямо в форме,
   пока мастер выбирает время, а не после сохранения. */
function busyLine(a){
  if(!a.date || !a.time || !a.dur) return { free:true, text:'' };
  var hit = overlapHit(a);
  var st = mins(a.time), en = st + a.dur;
  var range = a.time + ' — ' + hhmm(en);
  if(!hit){
    return { free:true, text: 'Время свободно: ' + range + '.' };
  }
  var who = hit.clientId ? cli(hit.clientId).name : 'приём';
  return { free:false,
    text: 'Занято: ' + who + ', ' + hit.time + ' — ' + hhmm(mins(hit.time) + hit.dur) +
          '. Новый приём идёт ' + range + ' и накладывается.' };
}

/* ================= действия ================= */
function act(name, id){
  switch(name){
    case 'tab': setTab(id); break;
    case 'hideInstall': DB.settings.installHidden = true; save(); render(); break;
    case 'showInstall': DB.settings.installHidden = false; save(); closeSheet(); setTab('today'); break;

    case 'start': {
      var a = apptById(id); if(!a) break;
      /* Идущий приём в кабинете может быть только один. Раньше новый старт
         молча сбрасывал предыдущий: клиентка сидит в кресле, а её таймер
         обнулён. Теперь про это спрашивают. */
      var busyNow = DB.appts.filter(function(x){
        return x.status === 'running' && x.id !== a.id;
      })[0];
      if(busyNow){
        askSheet('Идёт приём: ' + esc(cli(busyNow.clientId).name) + '.',
          'Если начать новый, у того приёма собьётся отсчёт времени и его придётся ' +
          'отмечать задним числом. Сначала лучше нажать «Завершить приём».',
          'Всё равно начать', 'startAnyway', a.id);
        break;
      }
      doStart(a);
      break;
    }
    case 'startAnyway': {
      var aSt = apptById(id); if(!aSt) break;
      doStart(aSt);
      break;
    }
    case 'cancelStart': {
      var a2 = apptById(id); if(!a2) break;
      snapshot(); a2.status = 'plan'; a2.startedAt = null; save(); render();
      break;
    }
    case 'extend': {
      var a3 = apptById(id); if(!a3) break;
      snapshot(); a3.dur += 15; save(); render();
      var wEx = overlapWarn(a3);
      toast(wEx ? 'Добавили 15 минут. ' + wEx : 'Добавили 15 минут', !!wEx);
      break;
    }
    case 'finish': {
      var a4 = apptById(id); if(!a4) break;
      snapshot(); a4.status = 'done'; a4.finishedAt = Date.now();
      if(a4.startedAt){
        var fact = Math.round((a4.finishedAt - a4.startedAt)/60000);
        a4.fact = fact;
        /* Фактическое время берём в расписание, только если оно правдоподобно.
           Сверху — забытая кнопка «Завершить»: она съела бы весь день.
           Снизу — нажатая по ошибке: раньше «Завершить» через шесть минут
           навсегда переписывал мужскую стрижку с сорока минут на шесть. */
        if(fact >= Math.max(5, Math.round(a4.dur / 3)) && fact <= a4.dur + 60){ a4.dur = fact; }
        else { a4.stuck = true; }
      }
      save(); closeSheet(); render();
      editCard(a4.id);
      break;
    }
    case 'pay': {
      var a5 = apptById(id); if(!a5) break;
      snapshot(); a5.status = 'paid'; save(); closeSheet(); render(); toast('Оплата отмечена');
      break;
    }
    case 'askDelAppt': {
      var ad = apptById(id); if(!ad) break;
      var hasCard = !!(ad.card && (ad.card.brand || ad.card.rootTone || ad.card.lenTone));
      var paidUp  = (ad.status === 'paid');
      /* Пустую будущую запись сносим сразу — это обычная уборка. А если в ней
         формула или оплата, теряется то, ради чего кабинет и заводили. */
      if(!hasCard && !paidUp){ act('delAppt', id); break; }
      var lost = [];
      if(hasCard) lost.push('формула окрашивания');
      if(paidUp)  lost.push(rub(ad.price) + ' из отчётов');
      askSheet(
        'Удалить приём ' + shortDate(ad.date) + ', ' + esc(workName(ad)) +
          ' — ' + esc(cli(ad.clientId).name) + '?',
        'Вместе с ним пропадёт ' + lost.join(' и ') +
          '. Пока кабинет открыт, это можно вернуть стрелкой в шапке; после ' +
          'перезагрузки — уже нет.',
        'Да, удалить', 'delAppt', id);
      break;
    }
    case 'delAppt': {
      snapshot();
      DB.appts = DB.appts.filter(function(x){ return x.id !== id; });
      save(); closeSheet(); render(); toast('Запись удалена');
      break;
    }
    case 'apptCard': apptCard(id); break;
    case 'editCard': editCard(id); break;
    case 'clientCard': clientCard(id); break;
    case 'editClient': formClient(id); break;
    case 'addClient': formClient(null); break;
    case 'addAppt': formAppt(null); break;
    case 'bookNext': formAppt(id); break;
    case 'write': writeTo(id); break;
    case 'allergy': formAllergy(id); break;
    case 'saveAllergy': {
      var ca = cli(id); if(!ca) break;
      snapshot(); ca.allergy = val('al_date') || today();
      save(); closeSheet(); render(); toast('Аллергопроба отмечена');
      break;
    }
    case 'sendConfirm': sendSheet('confirm', id); break;
    case 'sendRemind': sendSheet('remind', id); break;
    case 'markSent': {
      var mp = (id || '').split(':');
      markSent(mp[0], mp[1]);
      render(); closeSheet();
      toast(mp[0] === 'confirm' ? 'Отмечено: подтверждение отправлено' : 'Отмечено: напоминание отправлено');
      break;
    }
    case 'moveAppt': formMove(id); break;
    case 'saveMove': {
      var am = apptById(id); if(!am) break;
      var nd = val('mv_date'), nt = val('mv_time');
      if(!nd || !nt){ toast('Укажите дату и время'); break; }
      var mDur = (parseInt(val('mv_h'), 10) || 0) * 60 + (parseInt(val('mv_m'), 10) || 0);
      if(mDur < 5){ toast('Впишите, сколько идёт приём'); break; }
      var mPrice = parseInt(val('mv_price'), 10) || 0;
      var mCli = val('mv_client') || am.clientId;
      var mSvc = val('mv_service') || am.serviceId;
      var moved = (nd !== am.date || nt !== am.time);
      var swapped = (mCli !== am.clientId || mSvc !== am.serviceId);
      if(!moved && !swapped && mDur === am.dur && mPrice === am.price){
        closeSheet(); toast('Ничего не изменилось'); break;
      }
      snapshot();
      am.date = nd; am.time = nt; am.dur = mDur; am.price = mPrice;
      am.clientId = mCli;
      if(mSvc !== am.serviceId){
        /* работу переписываем целиком — и ссылку, и название с родом.
           Длительность и цену не трогаем: они здесь уже свои */
        var mS = svc(mSvc);
        am.serviceId = mSvc; am.svcName = mS.name; am.svcKind = mS.kind || 'care';
      }
      /* отметки снимаются при переносе и при смене клиента или работы:
         клиенту уходило другое. Правка цены его не касается */
      if(moved || swapped){ am.sentConfirm = null; am.sentRemind = null; }
      save(); closeSheet(); render();
      var wm = overlapWarn(am);
      if(wm) toast(wm, true);
      else if(moved || swapped) toast('Запись изменена. Подтверждение нужно отправить заново');
      else toast('Запись изменена');
      break;
    }
    case 'addStock': formStock(); break;
    case 'addClean': formClean(); break;

    /* расписание: вид и шаг по датам */
    case 'apptMode': VIEW.mode = id; if(!VIEW.date) VIEW.date = today(); render(); break;
    case 'apptDay': VIEW.mode = 'day'; VIEW.date = id; render(); window.scrollTo(0, 0); break;
    case 'apptNow': VIEW.date = today(); render(); break;
    case 'apptPrev': case 'apptNext': {
      var step = (name === 'apptNext') ? 1 : -1;
      var md = VIEW.mode || 'week', cd = VIEW.date || today();
      if(md === 'day') VIEW.date = shiftDays(cd, step);
      else if(md === 'week') VIEW.date = shiftDays(weekStart(cd), step * 7);
      else VIEW.date = shiftMonths(monthStart(cd), step);
      render();
      break;
    }

    /* заметки */
    case 'addNote': formNote(null, id || ''); break;
    case 'editNote': formNote(id, ''); break;
    case 'noteParse': noteParsed(($('story') && $('story').value) || ''); break;
    case 'saveNote': {
      /* знаки расставляются и без нажатия кнопки: мастер про неё может
         не вспомнить, а заметка нужна читаемой */
      var ntxt = punctuate(brandLatin(toneDots(numsInText(val('story')))), true).trim() || val('story').trim();
      if(!ntxt){ toast('Заметка пустая — расскажите или впишите текст'); break; }
      snapshot();
      var nc = val('nt_client') || null;
      var ex = id ? DB.notes.filter(function(x){ return x.id === id; })[0] : null;
      if(ex){ ex.text = ntxt; ex.clientId = nc; }
      else DB.notes.push({ id:uid(), date:today(), clientId:nc, text:ntxt });
      save(); closeSheet(); render(); toast('Заметка сохранена');
      break;
    }
    case 'delNote': {
      snapshot();
      DB.notes = DB.notes.filter(function(x){ return x.id !== id; });
      save(); closeSheet(); render(); toast('Заметка удалена. Вернуть — стрелкой наверху, пока кабинет открыт');
      break;
    }
    case 'closeSheet': closeSheet(); break;

    case 'stockMinus': case 'stockPlus': {
      var m = DB.stock.filter(function(x){ return x.id === id; })[0]; if(!m) break;
      snapshot();
      m.qty = Math.max(0, m.qty + (name === 'stockPlus' ? 1 : -1));
      if(name === 'stockPlus' && m.qty > m.min) m.ordered = false;
      save(); render();
      break;
    }
    case 'orderStock': {
      var m2 = DB.stock.filter(function(x){ return x.id === id; })[0]; if(!m2) break;

/* курсор стоит в поле ввода: там Ctrl+Z должен отменять набранный текст,
   а не последнее действие в кабинете */
function inField(el){
  if(!el) return false;
  if(el.isContentEditable) return true;
  var t = (el.tagName || '').toLowerCase();
  if(t === 'textarea') return true;
  if(t === 'select') return true;
  if(t === 'input'){
    var ty = (el.type || 'text').toLowerCase();
    return ['button','submit','reset','checkbox','radio','file','range','color'].indexOf(ty) < 0;
  }
  return false;
}
document.addEventListener('keydown', function(e){
  var typing = inField(e.target) || inField(document.activeElement);
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing){ e.preventDefault(); undo(); }
  if(e.key === 'Escape') closeSheet();
});
