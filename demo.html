<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<title>Точка красоты. Волосы — пример</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E7A9E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Точка красоты">
<meta name="application-name" content="Точка красоты. Волосы">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --ground:#F4F7FA; --card:#FFFFFF; --panel:#4E7A9E; --ink:#1F2E3C; --mut:#55697C;
  --line:#E1E8EF; --soft:#EDF2F6; --ok:#4B7F62; --stop:#2F6091; --warn:#B08347;
  /* охра для ТЕКСТА предупреждений: сама --warn слишком светлая, чтобы её читать */
  --warn-ink:#7A5520;
  --tint:#EBF2F8; --tintline:#CBDCEA;
  --on-stop:#FFFFFF; --on-ok:#FFFFFF;
  /* шапка: цвета текста и кнопок задаются отдельно, чтобы её можно было
     сделать как тёмной, так и светлой, не трогая остальной экран */
  --p-ink:#FFFFFF; --p-mut:#C3D8E6; --p-sub:#DDEAF3; --p-dim:#CFE0EC;
  --p-btn:#5D8AAE; --p-btn-ink:#EFF6FB; --p-line:transparent; --p-bad:#FFE3DC;
}
html[data-theme="dark"]{
  --ground:#101820; --card:#182029; --panel:#2C4A63; --ink:#E6EDF3; --mut:#8FA3B4;
  --line:#26313C; --soft:#1D2731; --ok:#6E9F82; --stop:#6FA3D2; --warn:#D2A468;
  --warn-ink:#E8BE85;
  --tint:#1A2836; --tintline:#2E4560;
  --on-stop:#0D1A26; --on-ok:#0D1A26;
  --p-ink:#EAF2F8; --p-mut:#A8C2D4; --p-sub:#CBDDEA; --p-dim:#B6CBDC;
  --p-btn:#3A5C79; --p-btn-ink:#DCEAF4; --p-line:transparent; --p-bad:#F0A79B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;
  /* экран не должен ездить вбок ни при каких условиях */
  width:100%;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{
  background:var(--ground); color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
  /* двойное касание больше не увеличивает страницу */
  touch-action:manipulation;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--stop)}

.app{display:flex;flex-direction:column;height:100dvh;min-height:100dvh}

/* ---------- шапка ---------- */
.top{background:var(--panel);color:var(--p-ink);flex:none;
     border-bottom:1px solid var(--p-line);
     padding:calc(env(safe-area-inset-top) + 12px) 16px 12px}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
/* знак слева от названия — тот же, что на ярлыке телефона */
.top-left{display:flex;align-items:flex-start;gap:11px;min-width:0}
.top-mark{flex:none;width:42px;height:42px;border-radius:11px;margin-top:2px;
          display:flex;align-items:center;justify-content:center;color:#DDB77C;
          background:linear-gradient(160deg,#33587D,#22466A 52%,#152F4C);
          box-shadow:0 2px 6px rgba(6,18,32,.28), inset 0 1px 0 rgba(255,255,255,.16)}
.top-mark svg{display:block}
.top-name{font-size:11.5px;color:var(--p-mut);letter-spacing:.04em}
.top-title{font-size:19px;font-weight:600;margin-top:3px;line-height:1.2}
.top-sub{font-size:12.5px;color:var(--p-sub);margin-top:6px}
.top-acts{display:flex;gap:6px;flex:none}
.tbtn{background:var(--p-btn);border:none;color:var(--p-btn-ink);border-radius:8px;
      min-width:38px;height:38px;display:flex;align-items:center;justify-content:center}
.tbtn:disabled{opacity:.35}
.saved{font-size:12px;color:var(--p-dim);margin-top:8px}
.saved.bad{color:var(--p-bad);font-weight:600}
.toast.bad{background:#8C4038}

/* ---------- экран ---------- */
/* overflow-y:auto сам по себе делает блок прокручиваемым и вбок — поэтому
   боковую прокрутку гасим явно. Ставится последней: сначала колонки ужимаются
   и слова переносятся, иначе скрытие спрячет то, что вылезло. */
.screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
        padding:14px 14px 26px;display:flex;flex-direction:column;gap:14px}
.sec-t{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:8px}
.muted{color:var(--mut);font-size:12px;margin-top:2px}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:26px 10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.list{display:flex;flex-direction:column;gap:8px}

/* ---------- полоса про ярлык ---------- */
.addbar{background:var(--tint);border:1px solid var(--tintline);border-radius:12px;padding:11px 12px;
        display:grid;grid-template-columns:38px 1fr 26px;gap:11px;align-items:center}
/* тот же знак, что и на настоящем ярлыке: на полоске он размером
   с ноготь, и буквы там не читаются — остаются одни ножницы */
.ab-ic{width:38px;height:38px;border-radius:10px;
       display:flex;align-items:center;justify-content:center;color:#DDB77C;
       background:linear-gradient(160deg,#33587D,#22466A 52%,#152F4C);
       box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.ab-ic svg{display:block}
.ab-t{font-size:13px;font-weight:600}
.ab-x{background:none;border:none;color:var(--mut);font-size:17px;height:38px}
/* полоса демонстрационного шаблона: охра — тот же цвет, которым кабинет
   везде говорит «обратите внимание» */
.addbar.demo{grid-template-columns:38px 1fr;border-color:var(--warn)}
.addbar.demo .ab-t{color:var(--warn)}

/* ---------- карточка «сейчас» ---------- */
.hero{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.badge{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--stop)}
.badge.ok{color:var(--ok)}
.badge.mut{color:var(--mut)}
.h-who{font-size:21px;font-weight:600;margin-top:8px;line-height:1.15}
.h-what{font-size:13px;color:var(--mut);margin-top:5px}
.prog-l{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:14px 0 6px}
.prog{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.prog>div{height:8px;background:var(--stop);border-radius:4px}
.prog>div.ok{background:var(--ok)}

/* ---------- кнопки ---------- */
.btns{display:grid;gap:9px;margin-top:14px}
.btns.two{grid-template-columns:1fr 1fr}
.btn{min-height:48px;display:flex;align-items:center;justify-content:center;gap:8px;
     border-radius:10px;font-size:14px;border:1px solid var(--line);
     background:var(--card);color:var(--ink);padding:0 14px;text-align:center;
     text-decoration:none}
a.btn{color:var(--ink)}
a.btn.primary{color:var(--on-stop)}
.btn.primary{background:var(--stop);border-color:var(--stop);color:var(--on-stop);font-weight:600}
.btn.green{background:var(--ok);border-color:var(--ok);color:var(--on-ok);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{min-height:40px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}

/* ---------- строки списка ---------- */
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
      display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;
      min-height:56px;width:100%;text-align:left}
.item.plain{grid-template-columns:minmax(0,1fr) auto}
/* Длинная фамилия или длинное название материала не должны раздвигать строку:
   без этого лента дня уезжала вбок и кнопки −1/+1 уходили за край экрана */
.item>*,.todo>*,.wk>*{min-width:0}
/* Правило общее, а не по списку классов: длинное слово встречается и в имени
   клиентки, и в названии материала, и в заметке, и в подписи, которую добавят
   потом. anywhere (а не break-word) обязателен: только он ужимает саму колонку
   сетки, а не просто переносит текст внутри неё. */
.screen, .sh-body{overflow-wrap:anywhere}
.i-time{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.i-who{font-size:14.5px;font-weight:600}
.i-what{font-size:12px;color:var(--mut);margin-top:2px}
.i-sum{font-size:12.5px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.next{border-color:var(--ok)}
.item.run{border-color:var(--stop);background:var(--tint)}
.item.past{opacity:.55}
.item.pick{width:100%;text-align:left;cursor:pointer}
.item.pick .tick{color:transparent;font-size:17px;font-weight:700}
.item.pick.on{border-color:var(--stop);background:var(--tint)}
.item.pick.on .tick{color:var(--stop)}
.item.brk{background:var(--soft);border-style:dashed;color:var(--mut);font-size:12.5px;
          grid-template-columns:52px 1fr auto}
/* приёмы у колориста длинные, и запись легко наложить на предыдущую —
   лента дня показывает наложение прямо там, где оно возникло */
.item.over{background:var(--card);border-style:dashed;border-color:var(--warn);color:var(--warn);
           font-size:12.5px;grid-template-columns:52px 1fr auto}

/* ---------- расписание: день, неделя, месяц ---------- */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--soft);
     border:1px solid var(--line);border-radius:11px;padding:4px}
.seg button{min-height:40px;border:none;background:transparent;color:var(--mut);
            font-size:13px;border-radius:8px;padding:0 2px}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;
               box-shadow:0 1px 2px rgba(31,46,60,.09)}
.per{display:grid;grid-template-columns:46px 1fr 46px;gap:8px;align-items:center;margin:2px 0}
.per .ttl{text-align:center;font-size:15px;font-weight:600;line-height:1.25}
.per .ttl span{display:block;font-size:11.5px;font-weight:400;color:var(--mut);margin-top:2px}
.per .nav{min-height:44px;border:1px solid var(--line);background:var(--card);
          border-radius:10px;color:var(--ink);font-size:16px;display:flex;
          align-items:center;justify-content:center}

.wk{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:11px 13px;min-height:58px;width:100%;text-align:left}
.wk.now{border-color:var(--stop);background:var(--tint)}
.wk .dt{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.wk .dt b{display:block;font-size:17px;color:var(--ink);letter-spacing:0;
          font-variant-numeric:tabular-nums;margin-top:1px}
.load{height:6px;border-radius:3px;background:var(--soft);overflow:hidden;margin-top:6px}
.load>div{height:6px;background:var(--stop);border-radius:3px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{font-size:10px;color:var(--mut);text-align:center;padding:3px 0;
         text-transform:uppercase;letter-spacing:.05em}
.cell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:9px;background:var(--card);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      font-size:13.5px;color:var(--ink);padding:2px;font-variant-numeric:tabular-nums}
.cell.out{opacity:.3}
.cell.has{background:var(--tint);border-color:var(--tintline);font-weight:600}
.cell.now{border-color:var(--stop);border-width:2px}
.cell .dots{display:flex;gap:2px;height:5px;align-items:center}
.cell .dots i{width:4px;height:4px;border-radius:50%;background:var(--stop);display:block}
.cell .dots u{font-size:9px;color:var(--stop);text-decoration:none;font-weight:600;line-height:1}

.todo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
      display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:10px;align-items:center;min-height:56px;width:100%;text-align:left}
.mk{width:9px;height:9px;border-radius:50%}
.act{font-size:12.5px;color:var(--stop);white-space:nowrap}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.stat{display:flex;justify-content:space-between;font-size:13px;
      border-bottom:1px solid var(--soft);padding-bottom:7px}
.stat b{font-weight:600;font-variant-numeric:tabular-nums}

.kvs{display:flex;flex-direction:column;gap:0;margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;
    border-bottom:1px solid var(--soft);padding:9px 0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:12.5px;color:var(--mut);line-height:1.45;margin:10px 0}

.chip-row{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:12px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);
      background:var(--card);color:var(--mut);min-height:36px;display:flex;align-items:center}
.chip.on{background:var(--panel);border-color:var(--panel);color:var(--p-ink)}
.tag{display:inline-block;font-size:10.5px;padding:3px 8px;border-radius:5px;margin-top:6px}
.tag.red{background:rgba(168,81,71,.13);color:var(--stop)}
.tag.amber{background:rgba(192,138,62,.15);color:var(--warn-ink)}
.tag.green{background:rgba(75,127,98,.14);color:var(--ok)}

/* ---------- поля ---------- */
.field{margin-bottom:12px}
.lab{font-size:12px;color:var(--mut);margin-bottom:5px;display:block}
/* 16px и ни на волос меньше: при меньшем размере Safari сам увеличивает
   страницу, как только палец попадает в поле, и после этого экран ездит вбок */
.inp{width:100%;min-width:0;max-width:100%;min-height:48px;border:1px solid var(--line);
     border-radius:10px;background:var(--card);padding:12px 13px;font-size:16px}
textarea.inp{min-height:120px;line-height:1.45;resize:vertical}
/* подпись единицы прямо в поле: «4» и рядом бледное «часов» */
.unit{position:absolute;right:13px;top:50%;transform:translateY(-50%);
      font-size:13px;color:var(--mut);pointer-events:none}
/* minmax(0,1fr), а не 1fr: поля с датой и временем на iPhone требуют себе
   больше места, чем есть в колонке, и без этого вылезают за край экрана */
.two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two-col>*{min-width:0}
.hintline{font-size:11.5px;color:var(--mut);margin-top:5px;line-height:1.4}
/* «Запишется так: …» — мастер видит результат, пока говорит.
   Пустая строка места не занимает, поэтому форма не прыгает */
/* подсказка не должна быть больше поля, которое поясняет:
   на заметке в тысячу знаков она вырастала на пол-экрана */
.prevline{font-size:12px;line-height:1.4;margin-top:5px;color:var(--ok);
          display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.prevline:empty{display:none}
.prevline.on{background:rgba(75,127,98,.10);border:1px solid rgba(75,127,98,.30);
             border-radius:8px;padding:6px 9px}
/* строка занятости под временем: зелёная — свободно, охра — накладка */
/* название материала — кнопка на всю ширину строки, но выглядит как текст */
.stock-t{background:none;border:none;padding:0;text-align:left;width:100%;color:inherit}
.busy{font-size:12.5px;line-height:1.4;border-radius:9px;padding:9px 11px;margin:-4px 0 12px;
      border:1px solid transparent}
.busy:empty{display:none}
.busy.free{background:rgba(75,127,98,.10);border-color:rgba(75,127,98,.32);color:var(--ok);font-weight:500}
.busy.hit{background:rgba(176,131,71,.12);border-color:var(--warn);color:var(--warn-ink);font-weight:600}
/* «Занято…» — единственное, что удерживает от двойной записи. Раньше это была
   самая бледная надпись на экране, при дневном свете её не прочитать. */

/* ---------- нижняя панель ---------- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
        background:var(--card);border-top:1px solid var(--line);
        padding-bottom:env(safe-area-inset-bottom)}
.nv{min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:10.5px;color:var(--mut);background:none;border:none}
.nv.on{color:var(--stop)}

/* ---------- шторка ---------- */
/* ---------- шторка ----------

   Шторка выезжает снизу поверх кабинета, и кабинет в этот момент отъезжает
   вглубь: уменьшается, скругляется по углам и притухает. Получается два
   слоя друг за другом, а не два плоских экрана. Шторку можно тянуть пальцем:
   вверх — во весь экран, вниз — закрыть. */
.stage{position:fixed;inset:0;background:#05121F;z-index:0}
.app{transform-origin:50% 0;
     transition:transform .26s cubic-bezier(.32,.72,0,1), border-radius .26s ease, filter .26s ease}
body.deep .app{transform:scale(.925) translateY(10px);border-radius:14px;
               overflow:hidden;filter:brightness(.82) saturate(.9)}

.veil{position:fixed;inset:0;background:rgba(6,16,26,.45);opacity:0;pointer-events:none;
      transition:opacity .22s ease;z-index:40}
.veil.on{opacity:1;pointer-events:auto}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--ground);
       border-radius:18px 18px 0 0;transform:translateY(100%);
       transition:transform .26s cubic-bezier(.32,.72,0,1), height .26s cubic-bezier(.32,.72,0,1);
       height:auto;max-height:92dvh;display:flex;flex-direction:column;
       box-shadow:0 -14px 40px rgba(4,14,24,.42), 0 -1px 0 rgba(255,255,255,.10) inset}
.sheet.on{transform:translateY(0)}
/* во весь экран — когда шторку подтянули вверх */
.sheet.tall{height:92dvh}
/* пока палец на шторке, она следует за ним без плавности */
.sheet.drag{transition:none}

/* полоска-ручка: за неё тянут, поэтому область касания шире самой полоски */
.sh-grip{flex:none;padding:9px 0 3px;touch-action:none;cursor:grab}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto;
      transition:background .15s ease,width .15s ease}
.sheet.drag .grab{background:var(--mut);width:52px}

.sh-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;
         padding:8px 16px 10px;border-bottom:1px solid var(--line);touch-action:none}
.sh-title{font-size:16px;font-weight:600}
.sh-x{background:none;border:none;color:var(--mut);font-size:20px;min-width:44px;min-height:44px}
.sh-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px;flex:1}
.sh-foot{flex:none;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);
         border-top:1px solid var(--line);display:grid;gap:9px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-14px);z-index:60;
       background:var(--panel);color:var(--p-ink);font-size:13px;padding:11px 16px;border-radius:10px;
       opacity:0;pointer-events:none;transition:all .2s ease;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* При открытой форме сообщение уходит вниз: наверху оно ложилось прямо на
   заголовок формы, и мастер переставала понимать, где находится. */
body.deep .toast{top:auto;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,14px)}
body.deep .toast.on{transform:translate(-50%,0)}
</style>
</head>

<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div class="top-left">
        <!-- знак с ярлыка: кабинет узнаётся с первого взгляда,

<script>
/* ================= данные и хранение ================= */
/* Ключ хранения. Смена ключа = чистый первый запуск: пока кабинет
   показывают, а не работают в нём, это правильнее, чем оставлять человека
   со старым, неполным примером. */
var KEY = 'tochka-krasoty-volosy-v2';

/* Демонстрационный шаблон. Собирается отдельным файлом: assemble_demo.py
   заменяет false на true. В этом виде кабинет открывается сразу заполненным,
   ничего не спрашивает при первом запуске и ничего не сохраняет — человек,
   которому его показывают, может нажимать что угодно, а следующее открытие
   вернёт пример в исходный вид, с датами от сегодняшнего дня. */
var DEMO = true;
var DB = null, UNDO = [], SAVED_AT = null;

function pad(n){ return (n<10?'0':'') + n; }
function iso(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function today(){ return iso(new Date()); }
function shiftDays(isoStr, days){
  var p = isoStr.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]);
  d.setDate(d.getDate() + days); return iso(d);
}
function daysBetween(a, b){
  var pa = a.split('-'), pb = b.split('-');
  var da = new Date(+pa[0], +pa[1]-1, +pa[2]), db = new Date(+pb[0], +pb[1]-1, +pb[2]);
  return Math.round((db - da) / 86400000);
}
function mins(hhmm){ var p = hhmm.split(':'); return (+p[0])*60 + (+p[1]); }
function hhmm(m){ m = Math.max(0, Math.round(m)); return pad(Math.floor(m/60)%24) + ':' + pad(m%60); }
function dur(m){
  var h = Math.floor(m/60), r = m%60;
  if(h && r) return h + ' ч ' + r + ' мин';
  if(h) return h + ' ч';
  return r + ' мин';
}
function rub(n){ return (n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' ₽'; }
var MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var WDAYS = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
var WDAYS_ACC = ['воскресенье','понедельник','вторник','среду','четверг','пятницу','субботу'];
var WDAYS_SHORT = ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
function longDate(isoStr){
  var p = isoStr.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]);
  return WDAYS[d.getDay()] + ', ' + (+p[2]) + ' ' + MONTHS[+p[1]-1];
}
/* «на субботу, 29 августа» — винительный падеж, иначе фраза в сообщении
   клиенту читается как машинная */
function dateAcc(isoStr){
  var p = isoStr.split('-'); var d = new Date(+p[0], +p[1]-1, +p[2]);
  return WDAYS_ACC[d.getDay()] + ', ' + (+p[2]) + ' ' + MONTHS[+p[1]-1];
}
function shortDate(isoStr){
  /* даты может не быть — копию ещё не делали, приёма не было.
     Пусть строка выйдет прочерком, а не уронит экран целиком. */
  if(!isoStr) return '—';
  var p = isoStr.split('-');
  var out = (+p[2]) + ' ' + MONTHS[+p[1]-1];
  /* Год дописываем только у чужого года. В истории клиентки иначе идут три
     одинаковые строки «31 августа», а формулу она выбирает именно по дате.
     Писать год везде нельзя: в ленте сегодняшнего дня он только шумит. */
  if(p[0] !== today().slice(0, 4)) out += ' ' + p[0];
  return out;
}
/* неделя считается с понедельника: так её видит мастер, а не браузер */
function weekStart(isoStr){
  var p = isoStr.split('-'), d = new Date(+p[0], +p[1]-1, +p[2]);
  var wd = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - wd);
  return iso(d);
}
function monthStart(isoStr){
  var p = isoStr.split('-');
  return p[0] + '-' + p[1] + '-01';
}
function shiftMonths(isoStr, n){
  var p = isoStr.split('-'), d = new Date(+p[0], +p[1]-1 + n, 1);
  return iso(d);
}
function daysInMonth(isoStr){
  var p = isoStr.split('-');
  return new Date(+p[0], +p[1], 0).getDate();
}
var MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                  'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function monthName(isoStr){
  var p = isoStr.split('-');
  return MONTHS_NOM[+p[1]-1] + ' ' + p[0];
}
function uid(){ return 'x' + Math.random().toString(36).slice(2, 9); }
function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* «34 дня», «31 день», «45 дней» — иначе строки отчёта читаются как машинные */
function days(n){
  var a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return n + ' дней';
  if(b > 1 && b < 5) return n + ' дня';
  if(b === 1) return n + ' день';
  return n + ' дней';
}

/* «1 туба», «2 тубы», «5 туб» — иначе остаток читается как машинный */
var UNIT_FORMS = {
  'туба':['туба','тубы','туб'], 'флакон':['флакон','флакона','флаконов'],
  'банка':['банка','банки','банок'], 'рулон':['рулон','рулона','рулонов'],
  'упаковка':['упаковка','упаковки','упаковок'], 'штука':['штука','штуки','штук'],
  'запись':['запись','записи','записей'], 'заметка':['заметка','заметки','заметок']
};
function unitOf(n, unit){
  var f = UNIT_FORMS[unit];
  if(!f) return unit;
  var a = Math.abs(n) % 100, b = a % 10;
  if(a > 10 && a < 20) return f[2];
  if(b > 1 && b < 5) return f[1];
  if(b === 1) return f[0];
  return f[2];
}

/* при самом первом открытии кабинет спрашивает, с чего начать,
   и до ответа ничего не сохраняет */
var NEED_START = false;

function load(){
  if(DEMO){
    DB = seed();
    NEED_START = false;
    document.documentElement.setAttribute('data-theme', DB.settings.theme || 'light');
    return;
  }
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){ DB = JSON.parse(raw); }
  }catch(e){ DB = null; }
  if(!DB || !DB.services){ DB = blank(); NEED_START = true; }
  if(!DB.settings) DB.settings = { theme:'light', installHidden:false, workStart:'09:00', workEnd:'21:00', lastBackup:null };
  if(DB.settings.place == null) DB.settings.place = '';
  if(DB.settings.signature == null) DB.settings.signature = '';
  if(DB.settings.stockAskedOn === undefined) DB.settings.stockAskedOn = null;
  if(DB.settings.backupSnoozed === undefined) DB.settings.backupSnoozed = null;
  /* границы рабочего дня — не украшение: без них лента дня и весь экран
     «Сегодня» падают на первом же расчёте времени */
  if(!DB.settings.workStart) DB.settings.workStart = '09:00';
  if(!DB.settings.workEnd)   DB.settings.workEnd   = '21:00';
  /* недостающие разделы восполняем так же, как это делает загрузка копии,
     иначе база из более ранней сборки роняет вкладки при каждом нажатии */
  if(!Array.isArray(DB.clients)) DB.clients = [];
  if(!Array.isArray(DB.appts))   DB.appts   = [];
  if(!Array.isArray(DB.stock))   DB.stock   = [];
  if(!Array.isArray(DB.clean)) DB.clean = [];
  if(!Array.isArray(DB.notes)) DB.notes = [];
  /* карточка клиента из более ранней сборки: один ритм разворачиваем в два.
     Если мастер его не задавала — оставляем пусто, кабинет посчитает сам. */
  DB.clients.forEach(function(c){
    if(c.cycleRoots === undefined) c.cycleRoots = c.cycle || null;
    if(c.cycleCut === undefined) c.cycleCut = c.cycle ? Math.round(c.cycle * 1.6) : null;
    if(c.allergy === undefined) c.allergy = null;
  });
  /* Записи из более ранней сборки не знают, что за работа в них была: раньше
     это каждый раз брали из прайса. Переносим название и род один раз — по
     нынешнему прайсу, пока он ещё цел. Дальше правка прайса на прошлое не влияет. */
  DB.appts.forEach(function(a){
    if(a.svcName && a.svcKind) return;
    var s = (DB.services || []).filter(function(x){ return x.id === a.serviceId; })[0];
    if(!a.svcName) a.svcName = (s && s.name) || 'Процедура';
    if(!a.svcKind) a.svcKind = (s && s.kind) || 'care';
  });
  MY_STAMP = DB.stamp || 0;
  tidyStatuses();
  document.documentElement.setAttribute('data-theme', DB.settings.theme || 'light');
}

/* приём, начатый вчера и не завершённый, переводим в «ждёт оплаты»,
   иначе он пропадает с экрана «Сегодня» и добраться до него неоткуда */
function tidyStatuses(){
  var t = today(), changed = false;
  DB.appts.forEach(function(a){
    if(a.status === 'running' && a.date < t){
      a.status = 'done';
      a.stuck = true;
      if(a.startedAt && !a.fact) a.fact = null;
      changed = true;
    }
  });
  if(changed) save(true);
}

var SAVE_OK = true;
/* Кабинет может быть открыт дважды: иконкой на экране и забытой вкладкой
   в Safari. Оба окна пишут всю базу целиком, поэтому второе молча затирало
   то, что записали в первом. Метка времени в самой базе позволяет это
   заметить: если в памяти телефона лежит запись новее нашей, значит писало
   другое окно. Данные мы при этом не подменяем — человек может как раз
   заполнять форму, — а честно предупреждаем. */
var MY_STAMP = 0;
var CLASH_TOLD = false;

function otherWindowWrote(){
  if(DEMO) return false;
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return false;
    var stamp = JSON.parse(raw).stamp || 0;
    return MY_STAMP && stamp && stamp > MY_STAMP;
  }catch(e){ return false; }
}

function save(silent){
  /* в шаблоне для показа сохранять некуда и незачем: правки живут
     до перезагрузки страницы */
  if(DEMO){ SAVED_AT = null; paintSaved(); return; }
  if(otherWindowWrote() && !CLASH_TOLD){
    CLASH_TOLD = true;
    toast('Кабинет открыт ещё где-то, и там записали своё. Закройте лишнюю вкладку ' +
          'и перезагрузите эту, иначе записи затрут друг друга', true);
  }
  try{
    DB.stamp = MY_STAMP = Date.now();
    localStorage.setItem(KEY, JSON.stringify(DB));
    SAVED_AT = new Date();
    SAVE_OK = true;
  }catch(e){
    SAVE_OK = false;
    toast('Не сохранилось. Освободите место в телефоне или выйдите из режима инкогнито', true);
  }
  paintSaved();
}

function snapshot(){
  try{ UNDO.push(JSON.stringify(DB)); }catch(e){}
  if(UNDO.length > 20) UNDO.shift();
  var b = document.getElementById('btnUndo'); if(b) b.disabled = false;
}
function undo(){
  if(!UNDO.length){ toast('Отменять нечего'); return; }
  /* тема и скрытая подсказка — это вид, а не записи: отмена постороннего
     действия не должна перекрашивать кабинет */
  var keepTheme = DB.settings && DB.settings.theme;
  var keepHidden = DB.settings && DB.settings.installHidden;
  DB = JSON.parse(UNDO.pop());
  if(keepTheme) DB.settings.theme = keepTheme;
  if(keepHidden !== undefined) DB.settings.installHidden = keepHidden;
  document.documentElement.setAttribute('data-theme', DB.settings.theme || 'light');
  save(); render();
  toast('Последнее действие отменено');
  var b = document.getElementById('btnUndo'); if(b) b.disabled = !UNDO.length;
}
</script>

<script>
/* ================= общее ================= */
/* Дату сборки подставляет сборщик. Она видна в «Ещё → Настройки»: без неё
   ни мастер, ни тот, кто ей помогает, не может сказать, обновился кабинет
   или телефон показывает вчерашний файл. */
var SBORKA = '31.08.2026';
var TAB = 'today';
var VIEW = {};                    /* временное состояние экранов: поиск, выбранный клиент и т.п. */

function $(id){ return document.getElementById(id); }
function svc(id){ return DB.services.filter(function(s){ return s.id === id; })[0] || {name:'Процедура', dur:60, price:0, kind:null}; }

/* Что за работа была в этом приёме.

   Раньше кабинет каждый раз лез за названием и родом работы в прайс — а прайс
   мастер правит: убирает то, чего больше не делает, переименовывает, меняет род.
   Стоило убрать «Окрашивание корней», и все прошлые окрашивания превращались
   в уход: у клиенток слетал отсчёт «пора звать», а у первого окрашивания молча
   пропадало напоминание об аллергопробе.

   Теперь название и род записываются в саму запись в момент её создания —
   так же, как давно записываются длительность и цена. Прайс правится свободно,
   прошлое остаётся как было. */
function workName(a){
  return (a && a.svcName) || svc(a && a.serviceId).name;
}
function workKind(a){
  if(a && a.svcKind) return a.svcKind;
  var k = svc(a && a.serviceId).kind;
  return k || null;
}
function cli(id){ return DB.clients.filter(function(c){ return c.id === id; })[0] || {name:'Клиент', phone:'', cycleRoots:35, cycleCut:56}; }
function apptById(id){ return DB.appts.filter(function(a){ return a.id === id; })[0]; }
function byTime(a, b){ return (a.date + a.time) < (b.date + b.time) ? -1 : 1; }
function apptsOn(d){ return DB.appts.filter(function(a){ return a.date === d && a.status !== 'cancel'; }).sort(byTime); }
function isColor(a){ return workKind(a) === 'color'; }

/* Последний приём нужного рода: окрашивание считается отдельно от стрижки,
   потому что корни обновляют раз в месяц, а стрижку — раз в полтора-два. */
function lastVisitKind(clientId, kind){
  var list = DB.appts.filter(function(a){
    return a.clientId === clientId && (a.status === 'paid' || a.status === 'done') &&
           (!kind || workKind(a) === kind);
  }).sort(byTime);
  return list.length ? list[list.length-1].date : null;
}
function lastVisit(clientId){ return lastVisitKind(clientId, null); }

/* Личный ритм кабинет считает сам — по её же приёмам: промежуток между
   двумя окрашиваниями даёт срок по корням, между двумя стрижками — по стрижке.
   Мастеру вводить нечего. Вписанное вручную число главнее посчитанного:
   мастер знает про клиента то, чего в записях нет. */
var CYCLE_DEFAULT = { color:35, cut:56 };

function observedCycle(clientId, kind){
  var list = DB.appts.filter(function(a){
    return a.clientId === clientId && (a.status === 'paid' || a.status === 'done') &&
           workKind(a) === kind;
  }).sort(byTime);
  if(list.length < 2) return null;
  /* берём последние три промежутка: раньше клиент мог ходить по-другому */
  var gaps = [];
  for(var i = list.length - 1; i > 0 && gaps.length < 3; i--){
    var g = daysBetween(list[i-1].date, list[i].date);
    if(g > 0) gaps.push(g);
  }
  if(!gaps.length) return null;
  var sum = 0;
  gaps.forEach(function(g){ sum += g; });
  return Math.round(sum / gaps.length);
}

/* Срок кабинет считает сам: руками его нигде не вписывают.
   Сначала — по прошлым приёмам этой женщины, потом обычный срок.
   Старое поле, вписанное вручную, ещё может лежать в данных: если оно есть,
   уважаем его, но подписываем честно — «взято из карточки». */
function cycleOf(c, kind){
  var own = (kind === 'color') ? c.cycleRoots : c.cycleCut;
  if(own) return { days:own, by:'взято из карточки' };
  var obs = observedCycle(c.id, kind);
  if(obs) return { days:obs, by:'посчитано по её приёмам' };
  return { days:CYCLE_DEFAULT[kind], by:'пока обычный срок' };
}

function dueOne(c, kind){
  var lv = lastVisitKind(c.id, kind);
  var cyc = cycleOf(c, kind).days;
  if(!lv) return { text:'ещё не было', level:0, days:null, has:false };
  var left = cyc - daysBetween(lv, today());
  if(left <= -7) return { text:'просрочено на ' + days(-left), level:2, days:left, has:true };
  if(left <= 0)  return { text:'срок подошёл', level:2, days:left, has:true };
  if(left <= 3)  return { text:'через ' + days(left), level:1, days:left, has:true };
  return { text:'через ' + days(left), level:0, days:left, has:true };
}

/* Два ритма сводятся в одну строку: в списке клиентов место есть только
   на одну, а решение у мастера одно — звать или не звать. */
function dueInfo(c){
  var r = dueOne(c, 'color'), k = dueOne(c, 'cut');
  var why = [];
  if(r.level === 2) why.push('корни');
  if(k.level === 2) why.push('стрижка');
  var text;
  if(!r.has && !k.has) text = 'приёмов ещё не было';
  else if(why.length)  text = 'пора звать: ' + why.join(' и ');
  else if(r.has && k.has) text = 'корни ' + r.text + ' · стрижка ' + k.text;
  else if(r.has) text = 'корни ' + r.text;
  else text = 'стрижка ' + k.text;
  return { level: Math.max(r.level, k.level), text:text, roots:r, cut:k, why:why };
}

/* Аллергопроба нужна перед первым окрашиванием: это требование инструкции
   производителя краски и защита мастера, если клиент придёт с жалобой. */
function needAllergy(c){
  if(!c || c.allergy) return false;
  var wasColor = DB.appts.filter(function(a){
    return a.clientId === c.id && (a.status === 'paid' || a.status === 'done') && isColor(a);
  }).length;
  if(wasColor) return false;
  return DB.appts.filter(function(a){
    return a.clientId === c.id && a.status === 'plan' && a.date >= today() && isColor(a);
  }).length > 0;
}

function toast(msg, sticky){
  var t = $('toast');
  /* важное сообщение держится 7 секунд, и обычные подсказки его не затирают */
  if(!sticky && toast._lock && Date.now() < toast._lock) return;
  t.textContent = msg;
  t.classList.toggle('bad', !!sticky);
  t.classList.add('on');
  toast._lock = sticky ? Date.now() + 7000 : 0;
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('on'); }, sticky ? 7000 : 2600);
}
function paintSaved(){

/* Ножницы с настоящего ярлыка: те же координаты, что и в файле значка.
   Лезвия сужаются к концам, поэтому это заливка, а не линия; кольца
   рисуются обводкой, чтобы внутри осталось настоящее отверстие.
   Надписи здесь нет — на полоске размером с ноготь её не прочитать. */
function scissorsMark(px){
  return '<svg viewBox="27 12 46 46" width="' + px + '" height="' + px + '" ' +
    'fill="currentColor" stroke="none">' +
    '<path d="M43.47 37.28 L67.22 16.22 L68.78 17.78 L47.72 41.53 Z"/>' +
    '<path d="M56.53 37.28 L32.78 16.22 L31.22 17.78 L52.28 41.53 Z"/>' +
    '<circle cx="40" cy="45" r="6.45" fill="none" stroke="currentColor" stroke-width="4.3"/>' +
    '<circle cx="60" cy="45" r="6.45" fill="none" stroke="currentColor" stroke-width="4.3"/>' +
    '</svg>';

/* ================= шторка =================

   Шторка ведёт себя как физический лист бумаги, который вытянули снизу.
   За полоску-ручку и за заголовок её можно тащить пальцем: вниз — закрыть,
   вверх — развернуть во весь экран. Пока палец на шторке, она идёт за ним
   без плавности; отпустили — доезжает сама.

   Кабинет под шторкой в это время отъезжает вглубь: уменьшается, скругляется
   и притухает. Из-за этого видно, что это два слоя, а не два плоских экрана.
   Тот же приём, что в «Картах» и «Музыке» на iPhone. */
function openSheet(title, body, foot){
  $('shTitle').textContent = title;
  $('shBody').innerHTML = body;
  $('shFoot').innerHTML = foot || '';
  var sh = $('sheet');
  sh.classList.remove('tall', 'drag');
  sh.style.transform = '';
  sh.classList.add('on');
  $('veil').classList.add('on');
  document.body.classList.add('deep');
  watchSheetFields();
}

/* Перетаскивание шторки пальцем. */
var DRAG = null;

function sheetDrag(){
  var sh = $('sheet');
  if(!sh || sh.dataset.drag) return;
  sh.dataset.drag = '1';

  function start(e){
    /* мышью тащить незачем, но на планшете стилус ведёт себя как палец */
    DRAG = { y: e.clientY, t: Date.now(), moved: 0, tall: sh.classList.contains('tall') };
    sh.classList.add('drag');
    try{ e.target.setPointerCapture(e.pointerId); }catch(err){}
  }

  function move(e){
    if(!DRAG) return;
    var dy = e.clientY - DRAG.y;
    DRAG.moved = dy;
    /* вверх шторка идёт туго: выше своего края ей всё равно не подняться */
    var shift = dy < 0 ? dy / 3 : dy;
    sh.style.transform = 'translateY(' + shift + 'px)';
    e.preventDefault();
  }

  function end(){
    if(!DRAG) return;
    var dy = DRAG.moved, ms = Date.now() - DRAG.t;
    var fast = ms < 260 && Math.abs(dy) > 40;      /* короткий резкий смах */
    sh.classList.remove('drag');
    sh.style.transform = '';

    if(dy > 110 || (fast && dy > 0)){
      closeSheet();
    } else if(dy < -60 || (fast && dy < 0)){
      sh.classList.add('tall');                    /* подтянули вверх — во весь экран */
    } else if(DRAG.tall && dy > 60){
      sh.classList.remove('tall');                 /* опустили из полного в обычное */
    }
    DRAG = null;
  }

  ['shGrip', 'shHead'].forEach(function(id){
    var el = $(id); if(!el) return;
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
}
/* Все поля с пометкой data-mode берутся под наблюдение разом: не нужно
   помнить про каждое новое поле по отдельности. */
function watchSheetFields(){
  var list = document.querySelectorAll('#sheet [data-mode]');
  for(var i = 0; i < list.length; i++) watchDictation(list[i]);
}

function closeSheet(){
  if(DICT_TIMER){ clearTimeout(DICT_TIMER); DICT_TIMER = null; }
  var sh = $('sheet');
  sh.classList.remove('tall', 'drag');
  sh.style.transform = '';
  document.body.classList.remove('deep');
  $('sheet').classList.remove('on'); $('veil').classList.remove('on');
}

/* ================= показатели дня ================= */
/* Приёмы у колориста идут по два-четыре часа, поэтому окна считаются
   по фактическому концу предыдущей работы, а наложение записей
   не прячется: оно показывается прямо в ленте дня. */
function dayStats(d){
  var list = apptsOn(d);
  var busy = 0, expect = 0, got = 0;
  list.forEach(function(a){
    busy += a.dur; expect += a.price;
    if(a.status === 'paid') got += a.price;
  });
  var ws = mins(DB.settings.workStart), we = mins(DB.settings.workEnd);
  /* Отсчёт начинаем с более раннего из двух: начала рабочего дня и первого
     приёма. Иначе клиентка «до работы», в восемь при рабочем дне с девяти,
     каждый раз помечалась накладкой на приём, которого не было. */
  var cur = list.length ? Math.min(ws, mins(list[0].time)) : ws;
  var free = [], over = 0;
  list.forEach(function(a){
    var st = mins(a.time);
    if(st - cur >= 30) free.push({ from:cur, to:st });
    if(st < cur) over += Math.min(cur - st, a.dur);
    cur = Math.max(cur, st + a.dur);
  });
  var endsAt = Math.max(cur, ws);
  if(we - cur >= 30) free.push({ from:cur, to:we });
  return { count:list.length, busy:busy, expect:expect, got:got, free:free, list:list,
           over:over, endsAt:endsAt, late: endsAt > we };
}

/* Лента дня целиком: прошедшие приёмы, свободные окна, накладки и то,
   что впереди. Одна и та же лента показывается на «Сегодня» и в расписании
   на выбранный день. */
function dayRibbon(st, nextId, emptyText){
  var h = '<div class="list">';
  if(!st.list.length){
    h += '<div class="empty">' + esc(emptyText || 'Записей на сегодня нет') + '</div>';
    return h + '</div>';
  }
  /* та же поправка, что в dayStats: лента и счётчик накладок должны
     считать одинаково, иначе цифра и картинка разойдутся */
  var cur = Math.min(mins(DB.settings.workStart), mins(st.list[0].time));
  st.list.forEach(function(a){
    var start = mins(a.time);
    if(start - cur >= 30){
      h += '<div class="item brk"><div class="i-time">' + hhmm(cur) + '</div>' +
           '<div>Свободно</div><div class="i-sum">' + dur(start - cur) + '</div></div>';
    }
    if(start < cur){
      h += '<div class="item over"><div class="i-time">' + hhmm(start) + '</div>' +
           '<div>Накладка на предыдущий приём</div>' +
           '<div class="i-sum">' + dur(Math.min(cur - start, a.dur)) + '</div></div>';
    }
    cur = Math.max(cur, start + a.dur);
    var cl = a.status === 'paid' || a.status === 'done' ? 'past'
           : a.status === 'running' ? 'run'
           : (nextId && a.id === nextId ? 'next' : '');
    var mark = a.status === 'paid' ? 'оплачено' : a.status === 'done' ? 'ждёт оплаты'
             : a.status === 'running' ? 'идёт' : rub(a.price);
    /* длительность вынесена в правый столбец: у колориста названия процедур
       длинные, и в одну строку с ними она не помещается */
    h += '<button class="item ' + cl + '" data-act="apptCard" data-id="' + a.id + '">' +
           '<div class="i-time">' + a.time + '</div>' +
           '<div><div class="i-who">' + esc(cli(a.clientId).name) + '</div>' +
           '<div class="i-what">' + esc(workName(a)) + '</div></div>' +
           '<div class="i-sum">' + mark + '<div class="muted">' + dur(a.dur) + '</div></div>' +
         '</button>';
  });
  if(st.late){
    h += '<div class="item over"><div class="i-time">' + hhmm(mins(DB.settings.workEnd)) + '</div>' +
         '<div>Последний приём заканчивается позже конца рабочего дня</div>' +
         '<div class="i-sum">' + hhmm(st.endsAt) + '</div></div>';
  }
  return h + '</div>';
}

/* Копию просим раз в неделю, и только когда есть что терять. «Позже»
   убирает напоминание на три дня: каждый день просить — значит приучить
   закрывать не читая. */
function backupDue(){
  if(DEMO) return false;
  if(!DB.clients.length && !DB.appts.length) return false;
  var lb = DB.settings.lastBackup;
  if(lb && daysBetween(lb, today()) < 7) return false;
  var sn = DB.settings.backupSnoozed;
  if(sn && daysBetween(sn, today()) < 3) return false;
  return true;
}
function backupBar(){
  var lb = DB.settings.lastBackup;
  return '<div class="addbar">' +
    '<div class="ab-ic" aria-hidden="true">' + scissorsMark(27) + '</div>' +
    '<div><div class="ab-t">' + (lb ? 'Копия сделана ' + shortDate(lb) : 'Копию ещё не делали') + '</div>' +
    '<div class="muted">Записи и формулы лежат только в этом телефоне. Файл копии уйдёт ' +
      'в загрузки — положите его в облачную папку.</div>' +
    '<div class="btns two" style="margin-top:10px">' +
      '<button class="btn primary" data-act="doBackup">Сохранить копию</button>' +
      '<button class="btn" data-act="snoozeBackup">Позже</button>' +
    '</div></div>' +
  '</div>';
}

/* ================= экран «Сегодня» ================= */
function renderToday(){
  var d = today(), st = dayStats(d), now = new Date(), nowM = now.getHours()*60 + now.getMinutes();
  var h = '';

  if(DEMO){
    h += '<div class="addbar demo">' +
           '<div class="ab-ic" aria-hidden="true">' + scissorsMark(27) + '</div>' +
           '<div><div class="ab-t">Это пример, чтобы посмотреть</div>' +
           '<div class="muted">Клиенты и записи придуманы. Нажимайте что угодно: ничего ' +
             'не сломается и никуда не отправится. Следующее открытие вернёт пример ' +
             'в прежний вид.</div></div>' +
         '</div>';
  } else if(!DB.settings.installHidden){
    h += '<div class="addbar">' +
           '<div class="ab-ic" aria-hidden="true">' + scissorsMark(27) + '</div>' +

           '<button class="ab-x" data-act="hideInstall" aria-label="Скрыть">✕</button>' +
         '</div>';
  }

  if(backupDue()) h += backupBar();

  /* идущий приём ищется по всей базе, а не только среди сегодняшних: он мог
     начаться вчера вечером и перевалить за полночь, или быть отмечен задним
     числом. Пропасть с экрана он не имеет права — иначе кнопку «Завершить»
     негде нажать. */
  var running = DB.appts.filter(function(a){ return a.status === 'running'; })[0];
  var doneUnpaid = st.list.filter(function(a){ return a.status === 'done'; })[0];
  var next = st.list.filter(function(a){ return a.status === 'plan' && mins(a.time) + a.dur >= nowM; })[0]
          || st.list.filter(function(a){ return a.status === 'plan'; })[0];

  if(running){
    var c = cli(running.clientId), sName = workName(running);
    var passed = running.startedAt ? Math.round((Date.now() - running.startedAt)/60000) : 0;
    var left = running.dur - passed;
    h += '<div class="hero">' +
      '<div class="badge">СЕЙЧАС ИДЁТ ПРИЁМ</div>' +
      '<div class="h-who">' + esc(c.name) + '</div>' +
      '<div class="h-what">' + esc(sName) + ' · ' + rub(running.price) + '</div>' +
      '<div class="prog-l"><span>Идёт ' + dur(Math.max(0,passed)) + ' из ' + dur(running.dur) + '</span>' +
      '<span>' + (left > 0 ? 'осталось ' + dur(left) : 'время вышло') + '</span></div>' +
      '<div class="prog"><div style="width:' + Math.min(100, Math.round(passed/running.dur*100)) + '%"></div></div>' +
      '<div class="btns"><button class="btn primary" data-act="finish" data-id="' + running.id + '">Завершить приём</button></div>' +
      '<div class="btns two"><button class="btn" data-act="extend" data-id="' + running.id + '">Продлить 15 мин</button>' +
      '<button class="btn" data-act="cancelStart" data-id="' + running.id + '">Отменить начало</button></div>' +
      '</div>';
  } else if(doneUnpaid){
    var c2 = cli(doneUnpaid.clientId);
    h += '<div class="hero">' +
      '<div class="badge ok">ПРИЁМ ЗАВЕРШЁН</div>' +
      '<div class="h-who">' + esc(c2.name) + '</div>' +
      '<div class="h-what">' + esc(workName(doneUnpaid)) + ' · ждёт отметки об оплате</div>' +
      '<div class="btns"><button class="btn green" data-act="pay" data-id="' + doneUnpaid.id + '">Отметить оплату ' + rub(doneUnpaid.price) + '</button></div>' +
      '<div class="btns two"><button class="btn" data-act="bookNext" data-id="' + doneUnpaid.clientId + '">Записать на следующий раз</button>' +
      '<button class="btn" data-act="editCard" data-id="' + doneUnpaid.id + '">Что делали</button></div>' +
      '</div>';
  } else if(next){
    var c3 = cli(next.clientId);
    h += '<div class="hero">' +
      '<div class="badge mut">СЛЕДУЮЩИЙ ПРИЁМ · ' + next.time + '</div>' +
      '<div class="h-who">' + esc(c3.name) + '</div>' +
      '<div class="h-what">' + esc(workName(next)) + ' · ' + dur(next.dur) + ' · ' + rub(next.price) + '</div>' +
      '<div class="btns"><button class="btn primary" data-act="start" data-id="' + next.id + '">Начать приём</button></div>' +
      '<div class="btns two"><button class="btn" data-act="write" data-id="' + next.clientId + '">Написать</button>' +
      '<button class="btn" data-act="apptCard" data-id="' + next.id + '">Открыть запись</button></div>' +
      '</div>';
  } else {
    h += '<div class="hero"><div class="badge mut">НА СЕГОДНЯ ВСЁ</div>' +
      '<div class="h-who">Приёмов больше нет</div>' +
      '<div class="h-what">Можно закрыть день и посмотреть, кого пора звать</div>' +
      '<div class="btns"><button class="btn" data-act="tab" data-id="clients">Кого пора звать</button></div></div>';
  }

  /* лента дня */
  h += '<div><div class="sec-t">День целиком</div>' + dayRibbon(st, next ? next.id : null) + '</div>';

  /* нужно отметить */
  var todos = buildTodos();
  h += '<div><div class="sec-t">Нужно отметить</div><div class="list">';
  if(!todos.length){ h += '<div class="empty">Всё отмечено</div>'; }
  todos.forEach(function(t){
    h += '<button class="todo" data-act="' + t.act + '" data-id="' + t.id + '">' +
           '<span class="mk" style="background:' + t.color + '"></span>' +
           '<span><span style="font-size:14px;font-weight:600">' + esc(t.title) + '</span>' +
           '<div class="muted">' + esc(t.sub) + '</div></span>' +
           '<span class="act">' + t.action + '</span>' +
         '</button>';

  /* цифры */

       '<div class="stat"><span>Записей</span><b>' + st.count + '</b></div>' +

       '<div class="stat"><span>Получено</span><b>' + rub(st.got) + '</b></div>' +
       '</div>' +

           (st.count === 1 ? ' запись' : (st.count >= 2 && st.count <= 4 ? ' записи' : ' записей')) +
           '. Что из материалов закончилось?</div>' +
         '<div class="btns"><button class="btn primary" data-act="closeDay">Отметить, что закончилось</button></div>' +
         '<div class="hintline">Спрошу один раз в день. Так остаток не приходится ловить в момент, ' +
           'когда туба опустела.</div></div>';
  }

  $('topTitle').textContent = 'Сегодня';
  $('topSub').textContent = longDate(d);
  return h;
}

/* Вечерний вопрос о материалах. Показывается один раз в день — когда все приёмы
   отмечены или рабочий день кончился. Так мастеру не нужно ловить момент,
   в который кончилась краска: он отвечает один раз, когда уже не в работе. */
function dayIsOver(st){
  if(!DB.stock.length) return false;
  if(DB.settings.stockAskedOn === today()) return false;
  if(!st.count) return false;
  var open = st.list.filter(function(a){ return a.status !== 'paid'; }).length;
  var now = new Date(), nowM = now.getHours()*60 + now.getMinutes();
  return open === 0 || nowM >= mins(DB.settings.workEnd);
}

          }).join('') + '</div>';

    '<button class="btn ghost" data-act="closeDayNothing">Ничего не закончилось</button>');
}

var OUT_PICKED = {};

function buildTodos(){
  var out = [];
  DB.appts.filter(function(a){ return a.status === 'done'; })
          .sort(byTime).forEach(function(a){
    out.push({ act:'pay', id:a.id, color:'var(--stop)', title:cli(a.clientId).name,
               sub: (a.date < today() ? 'приём ' + shortDate(a.date) + ', ' : '') +
                    'не отмечена оплата, ' + rub(a.price), action:'отметить' });
  });
  /* аллергопроба перед первым окрашиванием идёт раньше подтверждений и звонков:
     без неё приём проводить нельзя */
  var seen = {};
  DB.appts.filter(function(a){
    return a.status === 'plan' && a.date >= today() && isColor(a);
  }).sort(byTime).forEach(function(a){
    if(seen[a.clientId]) return;
    var c = cli(a.clientId);
    if(!needAllergy(c)) return;
    seen[a.clientId] = 1;
    out.push({ act:'allergy', id:c.id, color:'var(--warn)', title:c.name,
               sub:'первое окрашивание ' + shortDate(a.date) + ', аллергопроба не отмечена',
               action:'отметить' });
  });
  /* прошедшие записи, которые так и не начали — иначе их нигде не видно */
  DB.appts.filter(function(a){ return a.status === 'plan' && a.date < today(); })
          .sort(byTime).forEach(function(a){
    out.push({ act:'apptCard', id:a.id, color:'var(--warn)', title:cli(a.clientId).name,
               sub:'запись ' + shortDate(a.date) + ' осталась неотмеченной', action:'открыть' });
  });
  /* завтрашние записи без напоминания и будущие без подтверждения:
     иначе про них вспоминают только когда клиент не пришёл */
  var tmr = shiftDays(today(), 1);
  DB.appts.filter(function(a){ return a.status === 'plan' && a.date === tmr && !a.sentRemind; })
          .sort(byTime).forEach(function(a){
    out.push({ act:'sendRemind', id:a.id, color:'var(--warn)', title:cli(a.clientId).name,
               sub:'завтра в ' + a.time + ', напоминание не отправлено', action:'напомнить' });
  });
  /* Клиенты, которых пора звать, идут раньше неподтверждённых записей:
     клиент без записи — это уже потерянный приём, неподтверждённая запись —
     пока только риск. */
  DB.clients.forEach(function(c){
    if(!lastVisit(c.id)) return;
    /* клиент в кресле или с будущей записью в списке звонков быть не должен */
    var future = DB.appts.filter(function(a){
      return a.clientId === c.id && a.status !== 'cancel' && a.date >= today();
    }).length;
    if(future) return;
    var d = dueInfo(c);
    if(d.level === 2){
      out.push({ act:'write', id:c.id, color:'var(--ok)', title:c.name,
                 sub:d.text, action:'написать' });
    }
  });
  /* не больше трёх неподтверждённых разом, иначе перечень вытеснит всё остальное */
  DB.appts.filter(function(a){
    return a.status === 'plan' && a.date > tmr && !a.sentConfirm;
  }).sort(byTime).slice(0, 3).forEach(function(a){
    out.push({ act:'sendConfirm', id:a.id, color:'var(--stop)', title:cli(a.clientId).name,
               sub:'запись ' + shortDate(a.date) + ', ' + a.time + ' не подтверждена', action:'подтвердить' });
  });
  DB.stock.filter(function(m){ return m.qty <= m.min && !m.ordered; }).forEach(function(m){
    out.push({ act:'orderStock', id:m.id, color:'var(--warn)', title:m.name,
               sub:'осталось ' + m.qty + ' ' + unitOf(m.qty, m.unit) + ', запас ниже нормы', action:'заказать' });
  });
  /* десять строк — предел, за которым перечень перестают читать */
  return out.slice(0, 10);
}

/* ================= экран «Клиенты» ================= */
function renderClients(){

/* ================= экран «Записи» =================
   Одно и то же расписание в четырёх видах: день, неделя, месяц и список
   того, что впереди. Вид и выбранная дата держатся в VIEW и не сбрасываются,
   пока мастер не уйдёт на другую вкладку. */

function periodBar(title, sub, back){
  return '<div class="per">' +
    '<button class="nav" data-act="apptPrev" aria-label="Назад">‹</button>' +
    '<div class="ttl">' + esc(title) + (sub ? '<span>' + esc(sub) + '</span>' : '') + '</div>' +
    '<button class="nav" data-act="apptNext" aria-label="Вперёд">›</button>' +
    '</div>' +
    (back ? '<button class="btn sm wide" data-act="apptNow">' + esc(back) + '</button>' : '');
}

function periodStats(list, label){
  var busy = 0, expect = 0, got = 0;
  list.forEach(function(a){
    busy += a.dur; expect += a.price;
    if(a.status === 'paid') got += a.price;
  });
  return '<div class="card"><div class="sec-t">' + esc(label) + '</div><div class="stats">' +
    '<div class="stat"><span>Записей</span><b>' + list.length + '</b></div>' +
    '<div class="stat"><span>Занято</span><b>' + dur(busy) + '</b></div>' +
    '<div class="stat"><span>Ожидается</span><b>' + rub(expect) + '</b></div>' +
    '<div class="stat"><span>Получено</span><b>' + rub(got) + '</b></div>' +
    '</div></div>';
}

function viewDay(d){
  var st = dayStats(d);
  var h = periodBar(longDate(d), st.count ? 'работа до ' + hhmm(st.endsAt) : 'записей нет',
                    d === today() ? '' : 'Вернуться к сегодняшнему дню');
  h += dayRibbon(st, null, 'В этот день записей нет');
  h += periodStats(st.list, 'День в цифрах');
  return h;
}

function viewWeek(d){
  var ws = weekStart(d), we = shiftDays(ws, 6);
  var p1 = ws.split('-'), p2 = we.split('-');
  var title = (p1[1] === p2[1])
    ? (+p1[2]) + '–' + (+p2[2]) + ' ' + MONTHS[+p1[1]-1]
    : shortDate(ws) + ' – ' + shortDate(we);
  var all = [];
  var h = periodBar(title, 'неделя целиком',
                    weekStart(today()) === ws ? '' : 'Вернуться к этой неделе');
  h += '<div class="list">';
  /* самый долгий день недели задаёт длину полоски загрузки: сравнение
     идёт между днями, а не с абстрактной нормой */
  var stats = [], maxBusy = 1;
  for(var i = 0; i < 7; i++){
    var dd = shiftDays(ws, i), s = dayStats(dd);
    stats.push([dd, s]);
    if(s.busy > maxBusy) maxBusy = s.busy;
    all = all.concat(s.list);
  }
  stats.forEach(function(x){
    var dd = x[0], s = x[1], p = dd.split('-');
    var wd = new Date(+p[0], +p[1]-1, +p[2]).getDay();
    var sum = s.list.reduce(function(a, b){ return a + b.price; }, 0);
    h += '<button class="wk' + (dd === today() ? ' now' : '') + '" data-act="apptDay" data-id="' + dd + '">' +
         '<div class="dt">' + WDAYS_SHORT[wd] + '<b>' + (+p[2]) + '</b></div>' +
         '<div><div class="i-who">' + (s.count
            ? s.count + (s.count === 1 ? ' запись' : (s.count >= 2 && s.count <= 4 ? ' записи' : ' записей'))
            : 'Свободно') + '</div>' +
         (s.count
            ? '<div class="i-what">' + s.list[0].time + '–' + hhmm(s.endsAt) + ' · ' + dur(s.busy) + '</div>' +
              '<div class="load"><div style="width:' + Math.round(s.busy / maxBusy * 100) + '%"></div></div>'
            : '<div class="i-what">записей нет</div>') +
         '</div>' +
         '<div class="i-sum">' + (s.count ? rub(sum) : '') + '</div>' +
         '</button>';
  });
  h += '</div>';
  h += periodStats(all, 'Неделя в цифрах');
  return h;
}

function viewMonth(d){
  var ms = monthStart(d), n = daysInMonth(ms), p = ms.split('-');
  var firstWd = (new Date(+p[0], +p[1]-1, 1).getDay() + 6) % 7;
  var h = periodBar(monthName(ms), 'месяц целиком',
                    monthStart(today()) === ms ? '' : 'Вернуться к этому месяцу');
  h += '<div class="cal">';
  ['пн','вт','ср','чт','пт','сб','вс'].forEach(function(w){ h += '<div class="hd">' + w + '</div>'; });
  for(var i = 0; i < firstWd; i++) h += '<div class="cell out"></div>';
  var all = [];
  for(var day = 1; day <= n; day++){
    var dd = p[0] + '-' + p[1] + '-' + pad(day);
    var list = apptsOn(dd);
    all = all.concat(list);
    var dots = '';
    if(list.length){
      dots = '<div class="dots">' +
        (list.length > 3 ? '<u>' + list.length + '</u>'
                         : new Array(list.length + 1).join('<i></i>')) + '</div>';
    } else {
      dots = '<div class="dots"></div>';
    }
    h += '<button class="cell' + (list.length ? ' has' : '') + (dd === today() ? ' now' : '') +
         '" data-act="apptDay" data-id="' + dd + '">' +
         '<span>' + day + '</span>' + dots + '</button>';
  }
  h += '</div>';
  h += '<div class="hintline">Касание по числу открывает этот день целиком.</div>';
  h += periodStats(all, 'Месяц в цифрах');
  return h;
}

function viewList(){
  var future = DB.appts.filter(function(a){
    return a.date >= today() && a.status !== 'cancel';
  }).sort(byTime);
  var h = '<div class="list">';
  if(!future.length) h += '<div class="empty">Впереди записей нет</div>';
  var lastDate = '';
  future.forEach(function(a){
    if(a.date !== lastDate){
      lastDate = a.date;
      h += '<div class="sec-t" style="margin:10px 0 2px">' +
           (a.date === today() ? 'Сегодня, ' + shortDate(a.date) : longDate(a.date)) + '</div>';
    }
    /* сегодняшние записи подтверждать поздно — метка только для будущих дней */
    var mark = '';
    if(a.status === 'plan' && a.date > today()){
      mark = a.sentConfirm
        ? '<span class="tag green">подтверждена</span>'
        : '<span class="tag red">не подтверждена</span>';
    }
    if(isColor(a) && needAllergy(cli(a.clientId))){
      mark += ' <span class="tag amber">нет аллергопробы</span>';
    }
    h += '<button class="item" data-act="apptCard" data-id="' + a.id + '">' +
           '<div class="i-time">' + a.time + '</div>' +
           '<div><div class="i-who">' + esc(cli(a.clientId).name) + '</div>' +
           '<div class="i-what">' + esc(workName(a)) + '</div>' + mark + '</div>' +
           '<div class="i-sum">' + rub(a.price) + '<div class="muted">' + dur(a.dur) + '</div></div>' +
         '</button>';
  });
  return h + '</div>';
}

var APPT_MODES = [['day','День'], ['week','Неделя'], ['month','Месяц'], ['list','Список']];

function renderAppts(){
  var mode = VIEW.mode || 'week';
  var d = VIEW.date || today();
  var h = '<button class="btn primary wide" data-act="addAppt">+ Новая запись</button>';
  h += '<div class="seg">' + APPT_MODES.map(function(m){
    return '<button' + (mode === m[0] ? ' class="on"' : '') +
           ' data-act="apptMode" data-id="' + m[0] + '">' + m[1] + '</button>';
  }).join('') + '</div>';

  var sub;
  if(mode === 'day'){ h += viewDay(d); sub = 'расписание на день'; }
  else if(mode === 'week'){ h += viewWeek(d); sub = 'расписание на неделю'; }
  else if(mode === 'month'){ h += viewMonth(d); sub = 'расписание на месяц'; }
  else {
    h += viewList();
    var cnt = DB.appts.filter(function(a){ return a.date >= today() && a.status !== 'cancel'; }).length;
    sub = cnt + ' впереди';
  }
  $('topTitle').textContent = 'Записи';
  $('topSub').textContent = sub;
  return h;
}

/* ================= заметки =================
   Между делом мастеру нужно записать не формулу и не запись, а мысль:
   что клиент просил, что купить, чем кончилась переделка. Печатать это
   некогда, поэтому здесь та же кнопка микрофона, что и в формуле. */
function noteLine(n){
  var who = n.clientId ? cli(n.clientId).name : 'без клиента';
  /* в списке заметка сжимается в одну строку, целиком её видно в карточке */
  var txt = String(n.text || '').replace(/\s+/g, ' ').trim();
  return '<button class="item plain" data-act="editNote" data-id="' + n.id + '">' +
    '<div><div class="i-who">' + esc(who) + '</div>' +
    '<div class="i-what">' + esc(txt.length > 90 ? txt.slice(0, 90) + '…' : txt) + '</div></div>' +
    '<div class="i-sum">' + shortDate(n.date) + '</div></button>';
}

function pageNotes(){
  var list = DB.notes.slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; });
  var h = '<div class="note">Наговорите что угодно: пожелание клиента, формулу, что купить. ' +
    'Кабинет сохранит текст как есть и покажет заметку в карточке клиента.</div>' +
    '<button class="btn primary wide" data-act="addNote">+ Новая заметка</button>' +
    '<div class="list" style="margin-top:10px">';
  if(!list.length) h += '<div class="empty">Заметок пока нет</div>';
  list.forEach(function(n){ h += noteLine(n); });
  h += '</div>';
  openSheet('Заметки', h, '<button class="btn" data-act="closeSheet">Закрыть</button>');
}

/* ================= голос: одна дорога на все поля =================

   Раньше их было две: собственная запись кабинета кнопкой «Записать голосом»
   и микрофон на клавиатуре телефона. Кнопка появлялась не во всех полях,
   работала не на всех телефонах и могла молча не начаться — а мастер видел
   то «Слушаю», то ничего, то кнопку возле одного поля и пустоту возле
   другого. Это и была та самая хлипкость.

   Осталась одна дорога — микрофон на клавиатуре. Он есть в каждом поле, где
   вообще можно печатать, всегда, и мастер им уже пользуется. Кабинет ничего
   не записывает и ничего не просит нажать: он только приводит в порядок то,
   что телефон написал. Кнопок, связанных с голосом, в кабинете больше нет. */

function voiceBlock(label, placeholder, value, mode){
  var forText = mode !== 'formula';
  return '<div class="field"><label class="lab">' + esc(label) + '</label>' +
    '<textarea class="inp" id="story" data-mode="' + (forText ? 'text' : 'formula') + '" ' +
    'placeholder="' + esc(placeholder) + '">' + esc(value || '') + '</textarea>' +
    '<div class="hintline">' + esc(voiceHint(forText)) + '</div></div>';
}

function voiceHint(forText){
  if(!forText){
    return 'Печатайте или диктуйте микрофоном на клавиатуре. Каждый кусок между паузами ' +
           'встанет на свою строку. «Точка» здесь означает точку в тоне: «семь точка один».';
  }
  return 'Печатайте или диктуйте микрофоном на клавиатуре. Пока говорите, под полем видно ' +
         'строку «Запишется так» — это готовый вид: числа цифрами, марка краски латиницей, ' +
         'знаки на местах. Он встанет в поле, как только вы из него выйдете.';
}

/* ================= паузы при диктовке с клавиатуры =================

   Когда диктует сам телефон, кабинет не видит ни пауз, ни концов фраз —
   слова просто дописываются в поле. Но паузу в речи видно по времени: между
   вставками появляется просвет. Кабинет запоминает эти места и потом делит
   по ним текст на предложения — ровно так же, как делил бы по паузам
   собственного распознавания.

   Ручную правку в середине текста отследить нельзя, поэтому при любой такой
   правке отметки сбрасываются: лучше одно предложение целиком, чем точка
   посреди слова. */
var DICT_MARKS = [], DICT_LAST = 0, DICT_PREV = '';
var DICT_GAP = 900;                     /* столько миллисекунд молчания = конец мысли */

function dictReset(v){ DICT_MARKS = []; DICT_LAST = 0; DICT_PREV = String(v || ''); }

/* Правка поля делается только когда мастер из него вышел.

   Раньше кабинет ждал три секунды тишины и правил текст прямо под пальцем.
   Так делать нельзя: телефон в это время ещё держит свою диктовку в памяти
   и, досказав фразу, вставляет её заново — текст удваивался. И сама правка
   на глазах, с задержкой, выглядела как «кабинет думает».

   Теперь всё происходит в один момент и незаметно: коснулись другого поля
   или нажали «Сохранить» — текст уже в порядке. */
var DICT_TIMER = null;

/* Наблюдение вешается на любое поле, куда можно диктовать: заметку, формулу,
   телефон. Что делать с надиктованным, поле говорит само — атрибутом
   data-mode. Отдельных кнопок ни у одного из них нет. */
function watchDictation(area){
  if(!area || area.dataset.watched) return;
  area.dataset.watched = '1';
  dictReset(area.value);

  /* строка «Запишется так: …» заводится один раз, сразу под полем */
  if(area.parentNode && !area.parentNode.querySelector('.prevline')){
    var box = document.createElement('div');
    box.className = 'prevline';
    if(area.nextSibling) area.parentNode.insertBefore(box, area.nextSibling);
    else area.parentNode.appendChild(box);
  }

  /* вернулись в поле — счёт пауз начинается заново, чужие отметки не в счёт */
  area.addEventListener('focus', function(){ dictReset(area.value); showPreview(area); });

  area.addEventListener('input', function(){
    var now = Date.now(), val = area.value;
    var grew = val.length > DICT_PREV.length && val.indexOf(DICT_PREV) === 0;
    if(!grew){ dictReset(val); showPreview(area); return; }
    if(DICT_LAST && now - DICT_LAST > DICT_GAP && DICT_PREV.trim()){
      DICT_MARKS.push(DICT_PREV.replace(/\s+$/, '').length);
    }
    DICT_LAST = now;
    DICT_PREV = val;
    /* поле не трогаем, только показываем, каким станет текст */
    showPreview(area);
  });

  /* ушли из поля — приводим текст в порядок сразу, ждать нечего */
  area.addEventListener('blur', function(){
    if(DICT_TIMER){ clearTimeout(DICT_TIMER); DICT_TIMER = null; }
    punctSilent(area);
  });
}

/* ================= числа словами в обычном тексте =================

   Мастер говорит «краска эстель семь один», «держать сорок минут» — и это
   должно лечь цифрами: «Estel 7.1», «держать 40 минут». Слово превращается
   в цифру не всегда, а только когда рядом есть на что опереться: другое
   числительное, единица измерения или соседняя цифра. Иначе «пришла одна»
   стало бы «пришла 1».
*/
var TEXT_NUM = {
  'ноль':0,'нуль':0,'один':1,'одна':1,'одно':1,'одну':1,'два':2,'две':2,'три':3,
  'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10,
  'одиннадцать':11,'двенадцать':12,'тринадцать':13,'четырнадцать':14,'пятнадцать':15,
  'шестнадцать':16,'семнадцать':17,'восемнадцать':18,'девятнадцать':19,
  'двадцать':20,'тридцать':30,'сорок':40,'пятьдесят':50,'шестьдесят':60,
  'семьдесят':70,'восемьдесят':80,'девяносто':90,
  'сто':100,'двести':200,'триста':300,'четыреста':400,'пятьсот':500,
  'шестьсот':600,'семьсот':700,'восемьсот':800,'девятьсот':900
};

/* Слова, после которых число — точно число: единицы измерения и счётные слова. */
var NUM_UNITS = ('минут минуты минута часов часа час грамм грамма граммов процент процента ' +
  'процентов дней дня день раз раза недель недели неделя месяц месяца месяцев рублей рубля ' +
  'рубль туб тубы туба флакон флакона флаконов банка банки банок рулон рулона рулонов ' +
  'упаковка упаковки упаковок штук штуки штука тон тона тонов минуток').split(' ');

/* «одна» без опоры остаётся словом: это чаще местоимение, чем число */
var SOFT_ONE = { 'один':1,'одна':1,'одно':1,'одну':1 };

function numsInText(text){
  var raw = String(text || '').split(/(\s+)/);          /* пробелы сохраняются */
  var words = [], idx = [];
  raw.forEach(function(t, i){ if(t.trim()){ words.push(t); idx.push(i); } });

  var val = words.map(function(w){
    var b = w.toLowerCase().replace(/[^а-яёa-z0-9]/g, '');
    return TEXT_NUM.hasOwnProperty(b) ? { n:TEXT_NUM[b], w:b, tail:w.replace(/^[^а-яёa-z0-9]*[а-яёa-z0-9]+/i, '') }
                                      : (/^[0-9]+$/.test(b) ? { n:+b, w:b, digit:true, tail:'' } : null);
  });

  function unitAt(i){
    var w = (words[i] || '').toLowerCase().replace(/[^а-яё]/g, '');
    return NUM_UNITS.indexOf(w) >= 0;
  }
  /* число оставляем словом, если оно одинокое «один» без опоры рядом */
  function keep(i){
    if(!val[i] || val[i].digit) return false;
    if(!SOFT_ONE.hasOwnProperty(val[i].w)) return true;
    return !!(val[i-1] && val[i-1] !== null) || !!(val[i+1] && val[i+1] !== null) || unitAt(i+1);
  }

  var out = words.slice();
  for(var i = 0; i < words.length; i++){
    if(!val[i] || !keep(i)) continue;
    /* составное число: «сорок пять» → 45, «девятьсот двенадцать» → 912 */
    var sum = val[i].n, last = val[i].n, j = i;
    while(val[j+1] && !val[j+1].digit){
      var canGo = (last >= 100 && last % 100 === 0) || (last >= 20 && last % 10 === 0);
      if(!canGo || val[j+1].n >= last) break;
      sum += val[j+1].n; last = val[j+1].n; j++;
    }
    out[i] = String(sum) + (val[j].tail || '');
    for(var k = i + 1; k <= j; k++) out[k] = null;
    i = j;
  }

  var res = [], p = 0;
  raw.forEach(function(t, i){
    if(idx[p] === i){ if(out[p] !== null) res.push(out[p]); p++; }
    else res.push(t);
  });
  return res.join('').replace(/\s{2,}/g, ' ').trim();
}

/* Бренд краски — это марка, а не русское слово: на тубе написано Wella,
   значит и в кабинете должно стоять Wella, а не «Велла». Телефон слышит
   бренд по-русски, поэтому переписываем его латиницей везде, где он попался:
   и в названии материала, и в заметке. */
function brandLatin(s){
  return String(s).split(/(\s+)/).map(function(w){
    var b = w.toLowerCase().replace(/[^а-яёa-z]/g, '');
    return (b && BRAND_OF.hasOwnProperty(b)) ? w.replace(/[а-яёa-z]+/i, BRAND_OF[b]) : w;
  }).join('');
}

/* Название материала: две цифры подряд — это тон краски («7 1» → «7.1»),
   бренд пишется как на тубе («эстель» → «Estel»), первая буква заглавная. */
function tidyName(s){
  var out = brandLatin(String(s).replace(/(\d)\s+(\d{1,2})(?![\d.])/g, '$1.$2'));
  out = out.trim();
  return out ? out.charAt(0).toUpperCase() + out.slice(1) : out;
}

/* В заметке две цифры подряд — тон краски только там, где это точно тон:
   сразу после названия бренда или слова «тон», «краска». В остальных местах
   «10 30» — это время или расход, и точка между ними всё испортит. */
function toneDots(s){
  return String(s).replace(
    /(^|\s)([A-Za-zА-Яа-яЁё’']+)(\s+)(\d{1,2})\s+(\d{1,2})(?![\d.,])/g,
    function(all, sp, word, gap, a, b){
      var k = word.toLowerCase().replace(/[^а-яёa-z]/g, '');
      var isTone = BRAND_OF.hasOwnProperty(k) ||
                   /^(тон|тона|тоном|тону|краска|краски|краской|краску)$/.test(k);
      return isTone ? sp + word + gap + a + '.' + b : all;
    });
}

/* Каким текст станет, когда мастер выйдет из поля. Само поле не трогает:
   пока палец в поле, телефон держит там свою диктовку, и переписывать
   значение нельзя — вставится второй раз. Поэтому один и тот же расчёт
   служит и для показа, и для правки. */
function tidyValue(area){
  if(!area || !area.value.trim()) return '';
  var mode = area.getAttribute('data-mode');

  if(mode === 'phone') return tidyPhone(area.value);
  /* название материала: числа цифрами, тон через точку, знаков не ставим */
  if(mode === 'name')  return tidyName(numsInText(area.value));
  /* формулу в цифры не переводим: её разбирает свой разбор, и «семь точка
     один» он понимает лучше, чем «7 точка 1». А бренд латиницей ставим:
     разбор одинаково понимает и «эстель», и «Estel». */
  if(mode === 'formula') return punctuate(brandLatin(area.value), false);
  return punctuate(brandLatin(toneDots(numsInText(area.value))), true);
}

/* Строка под полем: «Запишется так: …». Мастер видит результат сразу,
   пока говорит, а не после того, как выйдет из поля. */
function showPreview(area){
  var box = area && area.parentNode && area.parentNode.querySelector('.prevline');
  if(!box) return;
  var now = tidyValue(area);
  if(!now || now === area.value){ box.textContent = ''; box.className = 'prevline'; return; }
  box.textContent = 'Запишется так: ' + now.replace(/\n/g, ' / ');
  box.className = 'prevline on';
}

/* Приведение поля в порядок — молча, без сообщений, чтобы не мельтешить. */
function punctSilent(area){
  if(!area || !area.value.trim()) return;
  var now = tidyValue(area);
  /* «+7», которое стоит подсказкой, стирать нельзя: мастер только начал */
  if(!now || now === area.value) return;
  area.value = now;
  dictReset(now);
  showPreview(area);
  try{ area.setSelectionRange(now.length, now.length); }catch(e){}
}

/* Пауза не всегда конец мысли: человек может запнуться посреди фразы —
   «покрасить… в тёмный цвет». Если кусок начинается с предлога или союза,
   это продолжение предыдущего, а не новое предложение: приклеиваем назад. */
var GLUE_BACK = {
  'в':1,'во':1,'на':1,'с':1,'со':1,'к':1,'ко':1,'по':1,'из':1,'изо':1,'за':1,
  'под':1,'над':1,'о':1,'об':1,'обо':1,'от':1,'ото':1,'до':1,'при':1,'для':1,
  'про':1,'у':1,'без':1,'через':1,'между':1,'перед':1,
  'и':1,'а':1,'но':1,'да':1,'или':1,'либо':1,'же':1,'ли':1,'бы':1,'то':1,
  'что':1,'чтобы':1,'чтоб':1,'как':1,'если':1,'когда':1,'потому':1,'поэтому':1,
  'который':1,'которая':1,'которое':1,'которые':1,'которую':1,'которого':1
};

/* Собирает куски речи в текст: сначала склеивает оборванные фразы,
   потом каждый готовый кусок превращает в предложение. */
function assemblePieces(parts, forText){
  var merged = [];
  parts.forEach(function(p){
    var t = String(p).replace(/^\s+/, '');
    if(!t) return;
    var first = bareWord(t.split(/\s+/)[0] || '');
    if(merged.length && GLUE_BACK[first]) merged[merged.length - 1] += ' ' + t;
    else merged.push(t);
  });
  return merged.map(function(p){ return forText ? speechPiece(p) : p.trim(); })
               .filter(Boolean).join('\n');
}

/* Делит текст по отмеченным паузам и приводит каждый кусок в порядок.
   Переводы строки, которые в тексте уже есть, — тоже границы: иначе
   повторное нажатие кнопки склеило бы разложенное обратно в один кусок. */
function punctuate(text, forText){
  var s = String(text || '');
  if(!s.trim()) return '';
  var cuts = {};
  DICT_MARKS.forEach(function(n){ if(n > 0 && n < s.length) cuts[n] = 1; });
  for(var i = 0; i < s.length; i++) if(s.charAt(i) === '\n') cuts[i] = 1;
  var at = Object.keys(cuts).map(Number).sort(function(a, b){ return a - b; });

  var parts = [], from = 0;
  at.forEach(function(n){ parts.push(s.slice(from, n)); from = n; });
  parts.push(s.slice(from));
  return assemblePieces(parts, forText);
}

function formNote(id, preClient){
  var n = id ? DB.notes.filter(function(x){ return x.id === id; })[0] : null;
  var cur = n ? n.clientId : (preClient || '');

  }).join('');

      '<select class="inp" id="nt_client">' + opts + '</select></div>' +

      'Например: Ирина просила в следующий раз на полтона темнее. Седину закрывает хуже, ' +

  foot += '<button class="btn ghost" data-act="closeSheet">Отмена</button>';
  openSheet(id ? 'Заметка' : 'Новая заметка', h, foot);
}

/* Показ того, что кабинет расслышал в надиктованном. Ничего не сохраняет:
   мастеру важно один раз увидеть, что формулу можно не печатать. */
function noteParsed(text){
  var box = $('parsed'); if(!box) return;
  if(!text.trim()){
    box.innerHTML = '<div class="card" style="margin-top:10px"><div style="font-size:13px">' +
      'Сначала расскажите или продиктуйте.</div></div>';
    return;
  }
  var r = parseStory(text);
  var names = { brand:'Бренд', rootTone:'Тон корней', lenTone:'Тон длины', oxide:'Оксид',
                ratio:'Пропорция', hold:'Выдержка', grams:'Расход краски', zones:'Зоны',
                tech:'Техника', bleach:'Осветление', toneAfter:'Тонирование после',
                before:'Что было до', result:'Результат' };
  var rows = CARD_FIELDS.filter(function(f){ return r.card[f]; }).map(function(f){
    return esc(names[f]) + ': ' + esc(r.card[f] + (f === 'hold' ? ' мин' : ''));
  });
  if(r.rootsDays != null) rows.push('Корни отросли через ' + days(r.rootsDays));
  if(r.toneDays != null) rows.push('Тон вымылся через ' + days(r.toneDays));
  if(r.complaint) rows.push('Жалоба: ' + esc(r.complaint));
  box.innerHTML = rows.length
    ? '<div class="card" style="margin-top:10px;background:var(--tint);border-color:var(--tintline)">' +
      '<div class="sec-t">Кабинет расслышал</div>' +
      '<div style="font-size:13px;line-height:1.7">' + rows.join('<br>') + '</div>' +
      '<div class="hintline">Столько же он разберёт и в приёме, если продиктовать это в «Что делали».</div></div>'
    : '<div class="card" style="margin-top:10px"><div style="font-size:13px">' +
      'Формулы здесь нет — заметка сохранится как обычный текст.</div></div>';
}

var SRV_KIND = { color:'окрашивание', cut:'стрижка', care:'уход' };

/* Список процедур заполнен заготовкой — обычными для колориста работами
   со средними сроками и ценами. Это только чтобы кабинет заработал сразу,
   а не встретил мастера пустым списком. Любую строку можно открыть и
   поправить под себя, ненужную — удалить, свою — добавить. */

       'отсчитывает срок до отросших корней, после стрижки — срок до следующей стрижки.</div>';

function formService(id){
  var s = id ? DB.services.filter(function(x){ return x.id === id; })[0] : null;
  if(id && !s) return;
  var cur = s || { name:'', dur:60, price:0, kind:'cut' };
  /* Название процедуры мастер пишет какое угодно. А этот список — не список
     услуг, а выбор того, что кабинет будет отсчитывать после работы. Поэтому
     он и не пополняется: считать кабинет умеет ровно эти две вещи. */
  var COUNTS = [['color', 'когда отрастут корни'],

    return '<option value="' + k[0] + '"' + (cur.kind === k[0] ? ' selected' : '') + '>' +
           k[1] + '</option>';
  }).join('');

  /* Часы и минуты отдельно: сложное окрашивание идёт четыре часа, и умножать
     их на шестьдесят в уме мастер не должен. */
  var hh = Math.floor(cur.dur / 60), mm = cur.dur % 60;

  var h =
    '<div class="field"><label class="lab">Название</label>' +
      '<input class="inp" id="sv_name" value="' + esc(cur.name) + '" ' +
      'placeholder="Например: Наращивание волос"></div>' +
